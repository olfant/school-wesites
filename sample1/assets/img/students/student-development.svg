<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF5ED"/>
      <stop offset="50%" stop-color="#CDEBD6"/>
      <stop offset="100%" stop-color="#A7D7B5"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FBF8"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#073D26" flood-opacity="0.18"/>
    </filter>
    <clipPath id="heroClip">
      <rect x="50" y="40" width="900" height="720" rx="36"/>
    </clipPath>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect x="0" y="0" width="1000" height="800" fill="url(#bgGrad)"/>
    <circle cx="780" cy="180" r="140" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="780" cy="180" r="100" fill="#FDE68A" opacity="0.6"/>

    <path d="M 0 460 Q 200 380 420 440 T 800 400 T 1000 430 L 1000 800 L 0 800 Z" fill="#93C5A1" opacity="0.6"/>
    <path d="M 0 510 Q 250 450 550 500 T 1000 480 L 1000 800 L 0 800 Z" fill="#68A87B" opacity="0.7"/>

    <rect x="180" y="340" width="640" height="260" rx="12" fill="#FFFFFF" opacity="0.9" filter="url(#softShadow)"/>
    <polygon points="500,280 160,340 840,340" fill="#105A34"/>
    <rect x="440" y="300" width="120" height="35" rx="6" fill="#CDEBD6"/>
    <text x="500" y="322" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#073D26" text-anchor="middle">VIDYA NIKETAN +2</text>
    
    <rect x="230" y="355" width="24" height="150" fill="#EAF5ED"/>
    <rect x="350" y="355" width="24" height="150" fill="#EAF5ED"/>
    <rect x="470" y="355" width="24" height="150" fill="#EAF5ED"/>
    <rect x="530" y="355" width="24" height="150" fill="#EAF5ED"/>
    <rect x="650" y="355" width="24" height="150" fill="#EAF5ED"/>
    <rect x="770" y="355" width="24" height="150" fill="#EAF5ED"/>

    <path d="M 0 540 Q 500 500 1000 540 L 1000 800 L 0 800 Z" fill="#105A34"/>
    <path d="M 0 590 Q 500 560 1000 600 L 1000 800 L 0 800 Z" fill="#073D26"/>

    <g transform="translate(110, 480)">
      <rect x="-8" y="0" width="16" height="80" fill="#78350F"/>
      <circle cx="0" cy="-30" r="50" fill="#16864A"/>
      <circle cx="-25" cy="-20" r="35" fill="#105A34"/>
      <circle cx="25" cy="-20" r="35" fill="#16864A"/>
    </g>
    <g transform="translate(890, 470)">
      <rect x="-8" y="0" width="16" height="90" fill="#78350F"/>
      <circle cx="0" cy="-35" r="55" fill="#105A34"/>
      <circle cx="-30" cy="-25" r="40" fill="#16864A"/>
      <circle cx="30" cy="-25" r="40" fill="#073D26"/>
    </g>

    <!-- Boy Student (Left) -->
    <g transform="translate(360, 560)">
      <ellipse cx="0" cy="180" rx="90" ry="24" fill="#031F13" opacity="0.4"/>
      <path d="M -50 40 L -70 160 L 70 160 L 50 40 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
      <polygon points="0,48 -14,56 -10,135 0,150 10,135 14,56" fill="#105A34"/>
      <polygon points="-30,35 0,52 30,35 18,25 0,38 -18,25" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
      <circle cx="0" cy="-15" r="40" fill="#FBBF24"/>
      <path d="M -42 -25 C -40 -65 30 -70 42 -25 C 30 -50 -10 -50 -42 -25 Z" fill="#1E293B"/>
      <circle cx="-14" cy="-15" r="4" fill="#1E293B"/>
      <circle cx="14" cy="-15" r="4" fill="#1E293B"/>
      <path d="M -12 2 Q 0 14 12 2" stroke="#B45309" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M -45 50 Q -65 100 -50 160" stroke="#105A34" stroke-width="12" fill="none" stroke-linecap="round"/>
      <rect x="-35" y="110" width="65" height="50" rx="5" fill="#105A34" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="-30" y1="125" x2="20" y2="125" stroke="#CDEBD6" stroke-width="3"/>
      <line x1="-30" y1="135" x2="10" y2="135" stroke="#CDEBD6" stroke-width="3"/>
    </g>

    <!-- Girl Student (Right) -->
    <g transform="translate(620, 540)">
      <ellipse cx="0" cy="200" rx="90" ry="24" fill="#031F13" opacity="0.4"/>
      <path d="M -55 50 L -75 190 L 75 190 L 55 50 Z" fill="#105A34"/>
      <polygon points="-30,42 0,68 30,42 0,46" fill="#FFFFFF"/>
      <line x1="0" y1="68" x2="0" y2="190" stroke="#073D26" stroke-width="4"/>
      <circle cx="0" cy="-15" r="42" fill="#FBBF24"/>
      <path d="M -44 -15 C -44 -68 44 -68 44 -15 C 32 -52 -32 -52 -44 -15 Z" fill="#1E293B"/>
      <circle cx="-38" cy="-5" r="6" fill="#EF4444"/>
      <circle cx="-14" cy="-12" r="4" fill="#1E293B"/>
      <circle cx="14" cy="-12" r="4" fill="#1E293B"/>
      <path d="M -12 6 Q 0 18 12 6" stroke="#B45309" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="-20" y="105" width="70" height="60" rx="6" fill="#073D26" stroke="#CDEBD6" stroke-width="2.5"/>
      <rect x="-15" y="95" width="60" height="20" rx="4" fill="#F59E0B"/>
      <text x="15" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#CDEBD6" text-anchor="middle">JAC +2</text>
    </g>

    <!-- Floating Badge 1: Top Left -->
    <g transform="translate(100, 120)" filter="url(#softShadow)">
      <rect x="0" y="0" width="250" height="84" rx="20" fill="url(#cardGrad)" stroke="#CDEBD6" stroke-width="2"/>
      <circle cx="44" cy="42" r="26" fill="#EAF5ED"/>
      <path d="M 34 42 L 41 49 L 54 35" fill="none" stroke="#105A34" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#16864A" letter-spacing="1">EDUCATION FOR ALL</text>
      <text x="82" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#073D26">100% Free &amp; Inclusive</text>
    </g>

    <!-- Floating Badge 2: Bottom Right -->
    <g transform="translate(680, 620)" filter="url(#softShadow)">
      <rect x="0" y="0" width="240" height="84" rx="20" fill="url(#cardGrad)" stroke="#CDEBD6" stroke-width="2"/>
      <circle cx="44" cy="42" r="26" fill="#FEF3C7"/>
      <polygon points="44,28 48,37 58,38 50,45 53,55 44,50 35,55 38,45 30,38 40,37" fill="#D97706"/>
      <text x="82" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#D97706" letter-spacing="1">STUDENT MOTTO</text>
      <text x="82" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#073D26">Learn • Grow • Achieve</text>
    </g>
  </g>
</svg>