      <stop offset="0%" stop-color="#EAF5ED"/>
      <stop offset="100%" stop-color="#CDEBD6"/>
    </linearGradient>
    <linearGradient id="flaskLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16864A"/>
      <stop offset="100%" stop-color="#073D26"/>
    </linearGradient>
    <filter id="labShadow">
