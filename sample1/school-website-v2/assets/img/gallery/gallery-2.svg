  <text x="120" y="140" font-family="'Courier New', monospace" font-size="18" fill="#FDE68A">E = mc²   |   2H₂ + O₂ ➔ 2H₂O</text>
  <text x="120" y="180" font-family="'Courier New', monospace" font-size="16" fill="#FFFFFF">Photosynthesis: 6CO₂ + 6H₂O ➔ C₆H₁₂O₆ + 6O₂</text>
  <text x="120" y="220" font-family="'Courier New', monospace" font-size="16" fill="#A7D7B5">Ohm's Law: V = I × R  |  F = m × a</text>
  <path d="M 600 90 Q 640 120 600 150 T 600 210 T 600 270" stroke="#F59E0B" stroke-width="3" fill="none"/>
  <path d="M 630 90 Q 590 120 630 150 T 630 210 T 630 270" stroke="#38BDF8" stroke-width="3" fill="none"/>

