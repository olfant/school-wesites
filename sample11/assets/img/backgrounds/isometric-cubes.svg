<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45B875"/>
      <stop offset="100%" stop-color="#16864A"/>
    </linearGradient>
  </defs>
  <!-- Floating 3D Geometric Blocks for subtle depth backings -->
  <g opacity="0.12">
    <!-- Cube 1 -->
    <g transform="translate(150, 100)">
      <polygon points="60,0 120,35 60,70 0,35" fill="url(#cubeTop)"/>
      <polygon points="0,35 60,70 60,140 0,105" fill="#105A34"/>
      <polygon points="60,70 120,35 120,105 60,140" fill="#073D27"/>
    </g>
    <!-- Cube 2 -->
    <g transform="translate(380, 240)">
      <polygon points="50,0 100,30 50,60 0,30" fill="url(#cubeTop)"/>
      <polygon points="0,30 50,60 50,120 0,90" fill="#105A34"/>
      <polygon points="50,60 100,30 100,90 50,120" fill="#073D27"/>
    </g>
    <!-- Cube 3 -->
    <g transform="translate(100, 380)">
      <polygon points="40,0 80,25 40,50 0,25" fill="url(#cubeTop)"/>
      <polygon points="0,25 40,50 40,100 0,75" fill="#105A34"/>
      <polygon points="40,50 80,25 80,75 40,100" fill="#073D27"/>
    </g>
  </g>
</svg>
