<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#073D27"/>
      <stop offset="50%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#042B1D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#compGrad)"/>
  <!-- 3 Monitors in Perspective -->
  <!-- Left Screen -->
  <g transform="translate(100, 150)">
    <rect width="160" height="110" rx="6" fill="#EDF6EF" stroke="#45B875" stroke-width="3"/>
    <rect x="10" y="10" width="140" height="90" fill="#042B1D"/>
    <rect x="70" y="110" width="20" height="30" fill="#16864A"/>
    <polygon points="50,140 110,140 115,148 45,148" fill="#105A34"/>
    <text x="80" y="55" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="700" fill="#45B875" text-anchor="middle">&lt;CODE /&gt;</text>
  </g>
  <!-- Center Main Screen -->
  <g transform="translate(300, 110)">
    <rect width="200" height="140" rx="8" fill="#FFFFFF" stroke="#45B875" stroke-width="4"/>
    <rect x="12" y="12" width="176" height="116" fill="#042B1D"/>
    <rect x="88" y="140" width="24" height="40" fill="#16864A"/>
    <polygon points="65,180 135,180 140,190 60,190" fill="#105A34"/>
    <!-- Terminal Lines -->
    <line x1="25" y1="35" x2="140" y2="35" stroke="#45B875" stroke-width="3"/>
    <line x1="25" y1="55" x2="110" y2="55" stroke="#D9EFE0" stroke-width="3"/>
    <line x1="25" y1="75" x2="160" y2="75" stroke="#45B875" stroke-width="3"/>
    <line x1="25" y1="95" x2="80" y2="95" stroke="#45B875" stroke-width="3"/>
  </g>
  <!-- Right Screen -->
  <g transform="translate(540, 150)">
    <rect width="160" height="110" rx="6" fill="#EDF6EF" stroke="#45B875" stroke-width="3"/>
    <rect x="10" y="10" width="140" height="90" fill="#042B1D"/>
    <rect x="70" y="110" width="20" height="30" fill="#16864A"/>
    <polygon points="50,140 110,140 115,148 45,148" fill="#105A34"/>
    <circle cx="80" cy="55" r="22" fill="#105A34"/>
    <path d="M70,55 L77,62 L90,47" stroke="#45B875" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Desk in 3D -->
  <polygon points="40,320 760,320 790,420 10,420" fill="#042B1D" stroke="#16864A" stroke-width="2"/>
  <text x="400" y="455" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ICT & COMPUTER EDUCATION LAB</text>
  <text x="400" y="478" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" fill="#D9EFE0" text-anchor="middle">Digital Literacy • Vocational IT/ITeS Skill Development</text>
</svg>
