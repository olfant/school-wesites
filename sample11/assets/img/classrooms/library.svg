<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="libGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#042B1D"/>
      <stop offset="60%" stop-color="#073D27"/>
      <stop offset="100%" stop-color="#105A34"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#libGrad)"/>
  <!-- Bookshelves in 3D perspective -->
  <rect x="100" y="80" width="600" height="280" rx="6" fill="#042B1D" stroke="#16864A" stroke-width="6"/>
  <!-- Shelves -->
  <line x1="100" y1="170" x2="700" y2="170" stroke="#16864A" stroke-width="5"/>
  <line x1="100" y1="260" x2="700" y2="260" stroke="#16864A" stroke-width="5"/>
  <!-- Row 1 Books -->
  <g transform="translate(120, 90)">
    <rect x="0" y="0" width="22" height="80" fill="#45B875"/>
    <rect x="25" y="10" width="18" height="70" fill="#D9EFE0"/>
    <rect x="46" y="5" width="26" height="75" fill="#105A34"/>
    <rect x="75" y="0" width="20" height="80" fill="#EDF6EF"/>
    <rect x="100" y="12" width="25" height="68" fill="#45B875"/>
    <rect x="130" y="5" width="28" height="75" fill="#16864A"/>
    <!-- Stack of tilted books -->
    <rect x="200" y="0" width="24" height="80" fill="#D9EFE0"/>
    <rect x="228" y="10" width="20" height="70" fill="#45B875"/>
    <rect x="300" y="0" width="30" height="80" fill="#EDF6EF"/>
    <rect x="335" y="8" width="22" height="72" fill="#105A34"/>
    <rect x="400" y="0" width="26" height="80" fill="#45B875"/>
    <rect x="430" y="5" width="24" height="75" fill="#D9EFE0"/>
  </g>
  <!-- Row 2 Books -->
  <g transform="translate(120, 180)">
    <rect x="10" y="0" width="28" height="80" fill="#EDF6EF"/>
    <rect x="42" y="10" width="20" height="70" fill="#45B875"/>
    <rect x="66" y="5" width="24" height="75" fill="#105A34"/>
    <rect x="120" y="0" width="22" height="80" fill="#D9EFE0"/>
    <rect x="146" y="8" width="26" height="72" fill="#45B875"/>
    <rect x="250" y="0" width="32" height="80" fill="#16864A"/>
    <rect x="286" y="10" width="20" height="70" fill="#EDF6EF"/>
    <rect x="380" y="0" width="24" height="80" fill="#45B875"/>
    <rect x="408" y="5" width="28" height="75" fill="#D9EFE0"/>
  </g>
  <!-- Open Study Table in 3D -->
  <polygon points="180,360 620,360 660,430 140,430" fill="#105A34" stroke="#45B875" stroke-width="2"/>
  <!-- Open Book on Table -->
  <path d="M400,380 C370,370 330,370 310,375 L310,410 C330,405 370,405 400,415 C430,405 470,405 490,410 L490,375 C470,370 430,370 400,380 Z" fill="#FFFFFF"/>
  <text x="400" y="470" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">CENTRAL SCHOOL LIBRARY & RESOURCE HUB</text>
</svg>
