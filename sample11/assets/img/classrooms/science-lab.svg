<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="labGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#042B1D"/>
      <stop offset="60%" stop-color="#073D27"/>
      <stop offset="100%" stop-color="#105A34"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#labGrad)"/>
  <!-- Science Flasks & Equipment -->
  <g transform="translate(180, 100)">
    <!-- Flask 1 -->
    <path d="M60,60 L60,110 L10,210 C0,230 15,250 40,250 L100,250 C125,250 140,230 130,210 L80,110 L80,60 Z" fill="#D9EFE0" opacity="0.3" stroke="#45B875" stroke-width="4"/>
    <path d="M22,230 L118,230 C125,230 120,215 110,195 L30,195 C20,215 15,230 22,230 Z" fill="#45B875" opacity="0.8"/>
    <!-- Bubbles -->
    <circle cx="70" cy="180" r="8" fill="#FFFFFF"/>
    <circle cx="55" cy="150" r="5" fill="#FFFFFF"/>
    <circle cx="85" cy="130" r="6" fill="#FFFFFF"/>
  </g>
  <!-- Microscope Outline in 3D -->
  <g transform="translate(480, 120)">
    <!-- Base -->
    <ellipse cx="80" cy="220" rx="70" ry="20" fill="#EDF6EF" stroke="#45B875" stroke-width="3"/>
    <!-- Arm -->
    <path d="M80,210 C140,210 140,90 90,80 L70,80" stroke="#45B875" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- Eyepiece Tube -->
    <line x1="50" y1="40" x2="90" y2="90" stroke="#EDF6EF" stroke-width="16" stroke-linecap="round"/>
    <!-- Objective Turret -->
    <circle cx="65" cy="130" r="14" fill="#45B875"/>
    <line x1="65" y1="130" x2="60" y2="160" stroke="#EDF6EF" stroke-width="8"/>
    <!-- Stage -->
    <rect x="20" y="165" width="75" height="10" rx="3" fill="#D9EFE0"/>
  </g>
  <!-- Lab Bench in perspective -->
  <polygon points="50,380 750,380 780,480 20,480" fill="#042B1D" stroke="#16864A" stroke-width="2"/>
  <text x="400" y="440" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="800" fill="#D9EFE0" text-anchor="middle" letter-spacing="1">COMPOSITE SCIENCE & STEM LABORATORY</text>
  <text x="400" y="465" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" fill="#45B875" text-anchor="middle">Physics • Chemistry • Biology • Experiential Learning</text>
</svg>
