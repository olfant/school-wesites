<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="artGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#042B1D"/>
      <stop offset="60%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#16864A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#artGrad)"/>
  <!-- Easel with Painting -->
  <g transform="translate(300, 70)">
    <!-- Tripod Legs -->
    <line x1="100" y1="20" x2="30" y2="330" stroke="#042B1D" stroke-width="8"/>
    <line x1="100" y1="20" x2="170" y2="330" stroke="#042B1D" stroke-width="8"/>
    <line x1="100" y1="20" x2="100" y2="330" stroke="#042B1D" stroke-width="6"/>
    <!-- Canvas in 3D -->
    <rect x="20" y="80" width="160" height="180" rx="4" fill="#EDF6EF" stroke="#45B875" stroke-width="4"/>
    <!-- Tribal / Sohrai Folk Art Painting Motif -->
    <polygon points="50,140 100,100 150,140" fill="#105A34"/>
    <circle cx="100" cy="180" r="25" fill="#45B875"/>
    <line x1="40" y1="220" x2="160" y2="220" stroke="#16864A" stroke-width="4"/>
  </g>
  <text x="400" y="450" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">ART, CRAFT & CREATIVE DESIGN EXPO</text>
  <text x="400" y="475" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" fill="#D9EFE0" text-anchor="middle">Indigenous Tribal Arts • Clay Modeling • Recycling & Design</text>
</svg>
