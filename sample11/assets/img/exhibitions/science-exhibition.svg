<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="exGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#073D27"/>
      <stop offset="50%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#042B1D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#exGrad)"/>
  <!-- Science Fair Exhibition Stall -->
  <!-- Display Board in 3D -->
  <polygon points="160,80 640,80 640,240 160,240" fill="#EDF6EF" stroke="#45B875" stroke-width="4"/>
  <!-- Atom Graphic on Board -->
  <circle cx="400" cy="150" r="14" fill="#105A34"/>
  <ellipse cx="400" cy="150" rx="45" ry="16" fill="none" stroke="#45B875" stroke-width="2"/>
  <ellipse cx="400" cy="150" rx="45" ry="16" transform="rotate(60 400 150)" fill="none" stroke="#45B875" stroke-width="2"/>
  <ellipse cx="400" cy="150" rx="45" ry="16" transform="rotate(120 400 150)" fill="none" stroke="#45B875" stroke-width="2"/>
  <text x="400" y="215" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="800" fill="#042B1D" text-anchor="middle">SCIENCE, TECHNOLOGY & INNOVATION</text>
  <!-- Table with Working Working Model (Volcano / Solar Model) -->
  <polygon points="120,280 680,280 720,400 80,400" fill="#042B1D" stroke="#16864A" stroke-width="2"/>
  <polygon points="340,360 460,360 420,290 380,290" fill="#16864A"/>
  <circle cx="400" cy="275" r="12" fill="#FF9933"/>
  <text x="400" y="450" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">STUDENT SCIENCE & STEM EXHIBITION</text>
  <text x="400" y="475" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" fill="#D9EFE0" text-anchor="middle">Inspire Awards • Innovative Working Models • Environmental Awareness</text>
</svg>
