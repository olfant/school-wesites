<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16864A"/>
      <stop offset="50%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#073D27"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45B875"/>
      <stop offset="100%" stop-color="#D9EFE0"/>
    </linearGradient>
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#042B1D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Ring with 3D Depth -->
  <circle cx="200" cy="200" r="185" fill="#042B1D" filter="url(#shadow3d)"/>
  <circle cx="200" cy="200" r="172" fill="#EDF6EF" stroke="#45B875" stroke-width="4"/>
  <circle cx="200" cy="200" r="158" fill="url(#shieldGrad)"/>

  <!-- Academic Shield Shape -->
  <path d="M200,70 L280,120 L280,220 C280,280 200,320 200,320 C200,320 120,280 120,220 L120,120 Z" fill="#073D27" stroke="#45B875" stroke-width="5" filter="url(#shadow3d)"/>

  <!-- Open Book Symbol of Wisdom -->
  <path d="M200,195 C175,175 145,175 135,178 L135,248 C150,245 175,245 200,260 C225,245 250,245 265,248 L265,178 C255,175 225,175 200,195 Z" fill="#FFFFFF" stroke="#105A34" stroke-width="3"/>
  <path d="M200,195 L200,260" stroke="#105A34" stroke-width="3"/>
  <path d="M145,195 Q165,193 185,205" stroke="#45B875" stroke-width="2" fill="none"/>
  <path d="M145,210 Q165,208 185,220" stroke="#45B875" stroke-width="2" fill="none"/>
  <path d="M215,205 Q235,193 255,195" stroke="#45B875" stroke-width="2" fill="none"/>
  <path d="M215,220 Q235,208 255,210" stroke="#45B875" stroke-width="2" fill="none"/>

  <!-- Rising Sun / Knowledge Rays -->
  <circle cx="200" cy="155" r="22" fill="url(#goldGrad)"/>
  <path d="M200,122 L200,112 M176,131 L168,124 M224,131 L232,124 M162,155 L152,155 M238,155 L248,155" stroke="#45B875" stroke-width="3" stroke-linecap="round"/>

  <!-- Jharkhand Green Leaves / Garland of Growth -->
  <path d="M100,200 C85,240 110,290 145,320" stroke="#45B875" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M300,200 C315,240 290,290 255,320" stroke="#45B875" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Text Arc / School Identity -->
  <text x="200" y="52" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="15" font-weight="800" fill="#042B1D" text-anchor="middle" letter-spacing="1.5">CM SOE UPG GOVT+2 SCHOOL</text>
  <text x="200" y="360" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" fill="#105A34" text-anchor="middle" letter-spacing="2">VNIKETAN HALDIPOKHAR</text>
  <text x="200" y="380" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="600" fill="#69766C" text-anchor="middle">ESTD. JHARKHAND • U-DISE: 20180231602</text>
</svg>
