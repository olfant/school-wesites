<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#073D27"/>
      <stop offset="50%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#042B1D"/>
    </linearGradient>
    <filter id="pDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042B1D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="600" height="700" rx="24" fill="url(#pGrad)"/>
  
  <!-- Subtle Geometric Academic Backing -->
  <circle cx="300" cy="280" r="190" fill="#16864A" opacity="0.25"/>
  <circle cx="300" cy="280" r="140" fill="#45B875" opacity="0.2"/>

  <!-- Head Silhouette -->
  <ellipse cx="300" cy="240" rx="75" ry="90" fill="#EDF6EF" filter="url(#pDrop)"/>
  
  <!-- Suit / Shoulders Silhouette -->
  <path d="M160,500 C160,370 210,340 300,340 C390,340 440,370 440,500 L470,620 L130,620 Z" fill="#D9EFE0" filter="url(#pDrop)"/>
  <polygon points="300,340 270,450 330,450" fill="#105A34"/>
  <polygon points="300,390 285,490 315,490" fill="#073D27"/>

  <!-- Official Badge Overlay -->
  <g transform="translate(150, 560)">
    <rect width="300" height="60" rx="30" fill="#042B1D" stroke="#45B875" stroke-width="2"/>
    <text x="150" y="36" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">OFFICIAL PRINCIPAL DESK</text>
  </g>

  <!-- Placeholder Caption -->
  <text x="300" y="660" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" fill="#D9EFE0" text-anchor="middle">[ Official Photograph Placeholder ]</text>
</svg>
