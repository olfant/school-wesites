<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#042B1D"/>
      <stop offset="50%" stop-color="#073D27"/>
      <stop offset="100%" stop-color="#105A34"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#fbGrad)"/>
  <!-- 3D Perspective Football Pitch -->
  <polygon points="120,120 680,120 780,420 20,420" fill="#105A34" stroke="#45B875" stroke-width="4"/>
  <!-- Field Markings -->
  <line x1="400" y1="120" x2="400" y2="420" stroke="#FFFFFF" stroke-width="3"/>
  <ellipse cx="400" cy="270" rx="90" ry="50" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <!-- Goal Post in 3D -->
  <polygon points="320,120 480,120 480,80 320,80" fill="none" stroke="#EDF6EF" stroke-width="3"/>
  <!-- Football -->
  <circle cx="400" cy="270" r="14" fill="#FFFFFF" stroke="#042B1D" stroke-width="2"/>
  <text x="400" y="465" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">SPORTS TOURNAMENTS & FOOTBALL LEAGUE</text>
</svg>
