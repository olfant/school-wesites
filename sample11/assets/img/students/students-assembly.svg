<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="asmbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#042B1D"/>
      <stop offset="50%" stop-color="#073D27"/>
      <stop offset="100%" stop-color="#105A34"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#asmbGrad)"/>
  <!-- Morning Assembly Rows in 3D Perspective -->
  <line x1="400" y1="60" x2="400" y2="160" stroke="#FFFFFF" stroke-width="4"/>
  <polygon points="400,60 450,75 400,90" fill="#FF9933"/>
  <rect x="400" y="75" width="50" height="7" fill="#FFFFFF"/>
  <polygon points="400,82 450,97 400,97" fill="#138808"/>
  <!-- Stage -->
  <polygon points="260,160 540,160 580,200 220,200" fill="#16864A"/>
  <!-- Assembly Rows (Multiple silhouettes standing in disciplined formation) -->
  <g fill="#D9EFE0" opacity="0.85">
    <!-- Row 1 -->
    <circle cx="280" cy="240" r="14"/><rect x="272" y="254" width="16" height="35" rx="3"/>
    <circle cx="340" cy="240" r="14"/><rect x="332" y="254" width="16" height="35" rx="3"/>
    <circle cx="400" cy="240" r="14"/><rect x="392" y="254" width="16" height="35" rx="3"/>
    <circle cx="460" cy="240" r="14"/><rect x="452" y="254" width="16" height="35" rx="3"/>
    <circle cx="520" cy="240" r="14"/><rect x="512" y="254" width="16" height="35" rx="3"/>
    <!-- Row 2 -->
    <circle cx="250" cy="310" r="16"/><rect x="240" y="326" width="20" height="42" rx="3"/>
    <circle cx="325" cy="310" r="16"/><rect x="315" y="326" width="20" height="42" rx="3"/>
    <circle cx="400" cy="310" r="16"/><rect x="390" y="326" width="20" height="42" rx="3"/>
    <circle cx="475" cy="310" r="16"/><rect x="465" y="326" width="20" height="42" rx="3"/>
    <circle cx="550" cy="310" r="16"/><rect x="540" y="326" width="20" height="42" rx="3"/>
  </g>
  <text x="400" y="460" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">MORNING ASSEMBLY & DISCIPLINE</text>
  <text x="400" y="482" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" fill="#D9EFE0" text-anchor="middle">Patriotism • Moral Values • Unity in Diversity</text>
</svg>
