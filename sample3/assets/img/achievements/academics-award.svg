<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#F3F8F4"/>
  <rect x="25" y="25" width="750" height="450" fill="#FFFFFF" stroke="#D9E5DC" stroke-width="2"/>

  <!-- Academic Medal & Ribbon Motif -->
  <g transform="translate(400, 220)">
    <!-- Ribbon -->
    <polygon points="-40,-130 0,-30 40,-130 15,-130 0,-80 -15,-130" fill="#105A34"/>
    <polygon points="-25,-130 0,-30 25,-130 10,-130 0,-80 -10,-130" fill="#E5C158"/>
    
    <!-- Medal -->
    <circle cx="0" cy="30" r="75" fill="#E5C158" stroke="#B88A23" stroke-width="4"/>
    <circle cx="0" cy="30" r="62" fill="#FFFFFF" stroke="#105A34" stroke-width="2" stroke-dasharray="6 3"/>
    
    <!-- Star & Laurel in Medal -->
    <polygon points="0,0 8,18 26,18 12,28 17,46 0,36 -17,46 -12,28 -26,18 -8,18" fill="#105A34"/>
    <text x="0" y="68" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#073E28" text-anchor="middle">ACADEMICS</text>
  </g>

  <!-- Swiss Header -->
  <rect x="50" y="50" width="220" height="30" fill="#073E28"/>
  <text x="160" y="70" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">ACADEMIC HONORS • [OFFICIAL]</text>
  <text x="400" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#647268" text-anchor="middle">
    Board Merit Distinctions &amp; Verified Institutional Scholastic Recognition
  </text>
</svg>
