<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#F3F8F4"/>
  <rect x="25" y="25" width="750" height="450" fill="#FFFFFF" stroke="#D9E5DC" stroke-width="2"/>

  <!-- Stage Curtains / Arc Geometric -->
  <path d="M 60,60 C 200,120 280,70 400,100 C 520,70 600,120 740,60 L 740,25 L 60,25 Z" fill="#073E28"/>
  <path d="M 60,60 L 100,380 L 60,400 Z" fill="#105A34" opacity="0.4"/>
  <path d="M 740,60 L 700,380 L 740,400 Z" fill="#105A34" opacity="0.4"/>

  <!-- Traditional Instruments (Mandar / Dholak / Flute) -->
  <g transform="translate(180, 220)">
    <!-- Mandar / Drum of Jharkhand -->
    <ellipse cx="60" cy="80" rx="35" ry="55" fill="#073E28"/>
    <ellipse cx="60" cy="80" rx="22" ry="38" fill="#E5C158"/>
    <line x1="28" y1="50" x2="160" y2="40" stroke="#105A34" stroke-width="3"/>
    <line x1="28" y1="110" x2="160" y2="120" stroke="#105A34" stroke-width="3"/>
    <ellipse cx="160" cy="80" rx="28" ry="46" fill="#073E28"/>
    <ellipse cx="160" cy="80" rx="16" ry="30" fill="#E5C158"/>
    <!-- Lace Crosses -->
    <line x1="45" y1="45" x2="150" y2="115" stroke="#16864A" stroke-width="2"/>
    <line x1="45" y1="115" x2="150" y2="45" stroke="#16864A" stroke-width="2"/>
  </g>

  <!-- Dancers in Folk Attire (Geometric Silhouettes) -->
  <g transform="translate(460, 160)">
    <!-- Dancer 1 -->
    <circle cx="40" cy="30" r="14" fill="#1D3024"/>
    <circle cx="40" cy="18" r="8" fill="#E5C158"/>
    <!-- Arms raised in dance gesture -->
    <path d="M 15,55 L 40,45 L 65,55" stroke="#105A34" stroke-width="5" fill="none"/>
    <polygon points="25,48 55,48 65,140 15,140" fill="#16864A"/>
    <!-- Traditional Shawl / Dupatta -->
    <path d="M 20,60 Q 40,90 60,60" stroke="#E5C158" stroke-width="4" fill="none"/>

    <!-- Dancer 2 -->
    <g transform="translate(90, 15)">
      <circle cx="40" cy="30" r="14" fill="#1D3024"/>
      <circle cx="40" cy="18" r="8" fill="#E5C158"/>
      <path d="M 15,55 L 40,45 L 65,55" stroke="#073E28" stroke-width="5" fill="none"/>
      <polygon points="25,48 55,48 65,140 15,140" fill="#105A34"/>
      <path d="M 20,60 Q 40,90 60,60" stroke="#E5C158" stroke-width="4" fill="none"/>
    </g>
  </g>

  <!-- Musical Notes in Air -->
  <text x="360" y="160" font-family="'Space Grotesk', sans-serif" font-size="28" fill="#16864A">♪</text>
  <text x="410" y="140" font-family="'Space Grotesk', sans-serif" font-size="34" fill="#E5C158">♫</text>

  <!-- Swiss Header -->
  <rect x="50" y="50" width="180" height="30" fill="#073E28"/>
  <text x="140" y="70" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">CULTURAL ACTIVITY • 01</text>
  <text x="400" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#647268" text-anchor="middle">
    Traditional Folk Dances, Classical Music, Drama &amp; National Celebrations
  </text>
</svg>
