<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#F3F8F4"/>
  <rect x="25" y="25" width="750" height="450" fill="#FFFFFF" stroke="#D9E5DC" stroke-width="2"/>

  <!-- Exhibition Stand Table -->
  <rect x="100" y="290" width="600" height="25" fill="#073E28"/>
  <rect x="130" y="315" width="16" height="120" fill="#105A34"/>
  <rect x="654" y="315" width="16" height="120" fill="#105A34"/>

  <!-- Working Model 1: Wind Turbine & Solar Array -->
  <g transform="translate(180, 140)">
    <!-- Tower -->
    <polygon points="45,150 55,150 52,40 48,40" fill="#647268"/>
    <!-- Rotor -->
    <circle cx="50" cy="40" r="7" fill="#073E28"/>
    <!-- Blades -->
    <polygon points="50,40 45,0 55,0" fill="#16864A"/>
    <polygon points="50,40 85,60 80,68" fill="#16864A"/>
    <polygon points="50,40 15,60 20,68" fill="#16864A"/>
    <!-- Solar panel -->
    <polygon points="90,140 130,120 150,140 110,160" fill="#105A34" stroke="#4AA875" stroke-width="1.5"/>
  </g>

  <!-- Working Model 2: Science Volcano & Geography Model -->
  <g transform="translate(360, 190)">
    <polygon points="20,100 80,10 140,100" fill="#8C5C38"/>
    <!-- Crater & Lava Flare -->
    <polygon points="65,25 95,25 80,5" fill="#E5C158"/>
    <path d="M 80,10 Q 95,30 90,60" stroke="#FF5722" stroke-width="3" fill="none"/>
    <text x="80" y="125" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#073E28" text-anchor="middle">EARTH SCIENCE</text>
  </g>

  <!-- Model 3: DNA Helix & Biology Display -->
  <g transform="translate(560, 130)">
    <!-- Stand -->
    <line x1="60" y1="20" x2="60" y2="160" stroke="#1D3024" stroke-width="4"/>
    <!-- Helix strands -->
    <path d="M 30,30 Q 60,60 90,90 Q 60,120 30,150" stroke="#105A34" stroke-width="3" fill="none"/>
    <path d="M 90,30 Q 60,60 30,90 Q 60,120 90,150" stroke="#16864A" stroke-width="3" fill="none"/>
    <!-- Cross links -->
    <line x1="38" y1="40" x2="82" y2="40" stroke="#E5C158" stroke-width="2"/>
    <line x1="48" y1="75" x2="72" y2="75" stroke="#E5C158" stroke-width="2"/>
    <line x1="38" y1="110" x2="82" y2="110" stroke="#E5C158" stroke-width="2"/>
    <line x1="48" y1="140" x2="72" y2="140" stroke="#E5C158" stroke-width="2"/>
  </g>

  <!-- Swiss Header -->
  <rect x="50" y="50" width="180" height="30" fill="#073E28"/>
  <text x="140" y="70" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">EXHIBITIONS • 03</text>
  <text x="400" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#647268" text-anchor="middle">
    Annual Science Projects, Eco-Innovation Models &amp; Art Displays
  </text>
</svg>
