<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#F3F8F4"/>
  <rect x="25" y="25" width="750" height="450" fill="#FFFFFF" stroke="#D9E5DC" stroke-width="2"/>

  <!-- Gears & Lightbulb Innovation Motif -->
  <!-- Gear 1 -->
  <g transform="translate(240, 220)">
    <circle cx="60" cy="60" r="45" fill="#E8F3EA" stroke="#105A34" stroke-width="4"/>
    <circle cx="60" cy="60" r="18" fill="#105A34"/>
    <!-- Teeth -->
    <rect x="52" y="5" width="16" height="15" fill="#105A34"/>
    <rect x="52" y="100" width="16" height="15" fill="#105A34"/>
    <rect x="5" y="52" width="15" height="16" fill="#105A34"/>
    <rect x="100" y="52" width="15" height="16" fill="#105A34"/>
    <rect x="20" y="20" width="16" height="16" fill="#105A34" transform="rotate(45, 28, 28)"/>
    <rect x="85" y="85" width="16" height="16" fill="#105A34" transform="rotate(45, 93, 93)"/>
    <rect x="20" y="85" width="16" height="16" fill="#105A34" transform="rotate(-45, 28, 93)"/>
    <rect x="85" y="20" width="16" height="16" fill="#105A34" transform="rotate(-45, 93, 28)"/>
  </g>

  <!-- Big Glowing Lightbulb in Center -->
  <g transform="translate(360, 140)">
    <path d="M 40,90 C 20,70 10,40 40,10 C 70,-20 100,10 100,40 C 100,70 80,90 80,110 L 40,110 Z" fill="#E5C158" stroke="#B88A23" stroke-width="3"/>
    <rect x="42" y="112" width="36" height="8" rx="2" fill="#647268"/>
    <rect x="45" y="122" width="30" height="8" rx="2" fill="#647268"/>
    <polygon points="50,132 70,132 60,142" fill="#1D3024"/>
    <!-- Filament -->
    <path d="M 50,75 L 55,45 L 65,45 L 70,75" stroke="#FFFFFF" stroke-width="3" fill="none"/>
    <!-- Glow rays -->
    <line x1="60" y1="-10" x2="60" y2="-25" stroke="#E5C158" stroke-width="3"/>
    <line x1="110" y1="15" x2="125" y2="5" stroke="#E5C158" stroke-width="3"/>
    <line x1="10" y1="15" x2="-5" y2="5" stroke="#E5C158" stroke-width="3"/>
  </g>

  <!-- Coding / Design Tablet on Right -->
  <g transform="translate(520, 190)">
    <rect x="20" y="20" width="140" height="100" rx="6" fill="#073E28" stroke="#16864A" stroke-width="2"/>
    <rect x="30" y="30" width="120" height="80" rx="3" fill="#FFFFFF"/>
    <!-- Graphic layout wires -->
    <circle cx="50" cy="50" r="10" fill="#4AA875"/>
    <rect x="70" y="45" width="60" height="10" rx="2" fill="#105A34"/>
    <rect x="50" y="70" width="80" height="6" rx="1" fill="#647268"/>
    <rect x="50" y="82" width="50" height="6" rx="1" fill="#647268"/>
    <circle cx="120" cy="90" r="6" fill="#E5C158"/>
  </g>

  <!-- Swiss Header -->
  <rect x="50" y="50" width="190" height="30" fill="#073E28"/>
  <text x="145" y="70" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">SKILLS COMPETITION • 04</text>
  <text x="400" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#647268" text-anchor="middle">
    Technical Problem Solving, Design Thinking, Debates &amp; Quiz Leagues
  </text>
</svg>
