<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#F3F8F4"/>
  <rect x="25" y="25" width="750" height="450" fill="#FFFFFF" stroke="#D9E5DC" stroke-width="2"/>

  <!-- Sports Ground / Arc Lines -->
  <path d="M 60,350 Q 400,200 740,350" stroke="#16864A" stroke-width="3" stroke-dasharray="10 5" fill="none"/>
  
  <!-- Football / Volleyball graphic -->
  <g transform="translate(160, 200)">
    <circle cx="70" cy="70" r="50" fill="#FFFFFF" stroke="#073E28" stroke-width="3"/>
    <polygon points="70,40 85,55 78,75 62,75 55,55" fill="#073E28"/>
    <polygon points="70,100 85,85 78,65 62,65 55,85" fill="#105A34"/>
    <polygon points="35,70 50,55 50,85" fill="#16864A"/>
    <polygon points="105,70 90,55 90,85" fill="#16864A"/>
  </g>

  <!-- Athletics Hurdles and Relay Baton -->
  <g transform="translate(360, 180)">
    <!-- Relay Baton -->
    <rect x="20" y="40" width="12" height="90" rx="6" fill="#E5C158" stroke="#B88A23" stroke-width="2" transform="rotate(-35, 26, 85)"/>
    <!-- Hurdle -->
    <line x1="80" y1="90" x2="160" y2="90" stroke="#073E28" stroke-width="8"/>
    <line x1="90" y1="90" x2="90" y2="160" stroke="#105A34" stroke-width="4"/>
    <line x1="150" y1="90" x2="150" y2="160" stroke="#105A34" stroke-width="4"/>
  </g>

  <!-- Badminton Racket & Shuttlecock -->
  <g transform="translate(560, 160)">
    <ellipse cx="60" cy="50" rx="35" ry="45" fill="none" stroke="#105A34" stroke-width="3"/>
    <!-- String Mesh -->
    <line x1="35" y1="50" x2="85" y2="50" stroke="#4AA875" stroke-width="1"/>
    <line x1="40" y1="35" x2="80" y2="35" stroke="#4AA875" stroke-width="1"/>
    <line x1="40" y1="65" x2="80" y2="65" stroke="#4AA875" stroke-width="1"/>
    <line x1="60" y1="15" x2="60" y2="85" stroke="#4AA875" stroke-width="1"/>
    <line x1="48" y1="20" x2="48" y2="80" stroke="#4AA875" stroke-width="1"/>
    <line x1="72" y1="20" x2="72" y2="80" stroke="#4AA875" stroke-width="1"/>
    <!-- Handle -->
    <line x1="60" y1="95" x2="60" y2="180" stroke="#073E28" stroke-width="5"/>
    <rect x="56" y="150" width="8" height="30" rx="2" fill="#E5C158"/>
  </g>

  <!-- Swiss Header -->
  <rect x="50" y="50" width="180" height="30" fill="#073E28"/>
  <text x="140" y="70" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">SPORTS &amp; ATHLETICS • 02</text>
  <text x="400" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#647268" text-anchor="middle">
    Track &amp; Field, Volleyball, Football, Badminton &amp; Physical Conditioning
  </text>
</svg>
