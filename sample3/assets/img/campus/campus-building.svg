    <rect x="160" y="170" width="50" height="40" rx="3"/>
    <rect x="230" y="170" width="50" height="40" rx="3"/>
    <rect x="300" y="170" width="50" height="40" rx="3"/>
    <rect x="450" y="170" width="50" height="40" rx="3"/>
    <rect x="520" y="170" width="50" height="40" rx="3"/>
    <rect x="590" y="170" width="50" height="40" rx="3"/>

    <rect x="160" y="240" width="50" height="40" rx="3"/>
    <rect x="230" y="240" width="50" height="40" rx="3"/>
    <rect x="300" y="240" width="50" height="40" rx="3"/>
    <rect x="450" y="240" width="50" height="40" rx="3"/>
    <rect x="520" y="240" width="50" height="40" rx="3"/>
    <rect x="590" y="240" width="50" height="40" rx="3"/>

    <rect x="160" y="310" width="50" height="40" rx="3"/>
    <rect x="230" y="310" width="50" height="40" rx="3"/>
