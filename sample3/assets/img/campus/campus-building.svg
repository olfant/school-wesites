  <!-- Portico / Entry -->
  <path d="M 365,400 L 365,240 L 435,240 L 435,400 Z" fill="#073E28"/>
  <rect x="380" y="270" width="40" height="130" fill="#FFFFFF" opacity="0.9"/>
  <!-- Base Lawn -->
  <rect x="40" y="400" width="720" height="60" fill="#4AA875"/>

  <!-- Swiss Index Tag -->
  <rect x="60" y="60" width="120" height="28" fill="#073E28"/>
  <text x="120" y="78" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">FACILITY / 01</text>
