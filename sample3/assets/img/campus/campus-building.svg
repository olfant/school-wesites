<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBldg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3F8F4"/>
      <stop offset="100%" stop-color="#E8F3EA"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgBldg)"/>
  <!-- Thin Swiss Grid Lines -->
  <line x1="40" y1="0" x2="40" y2="500" stroke="#D9E5DC" stroke-width="1"/>
  <line x1="760" y1="0" x2="760" y2="500" stroke="#D9E5DC" stroke-width="1"/>
  <line x1="0" y1="40" x2="800" y2="40" stroke="#D9E5DC" stroke-width="1"/>
  <line x1="0" y1="460" x2="800" y2="460" stroke="#D9E5DC" stroke-width="1"/>

  <!-- Building Graphic -->
  <rect x="120" y="140" width="560" height="260" fill="#FFFFFF" stroke="#105A34" stroke-width="2"/>
  <rect x="100" y="125" width="600" height="15" fill="#073E28"/>
  <rect x="280" y="90" width="240" height="40" fill="#105A34"/>
  <text x="400" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
