<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F3EA"/>
      <stop offset="60%" stop-color="#F3F8F4"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2ECE5"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#073E28"/>
    </linearGradient>
    <linearGradient id="lawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4AA875"/>
      <stop offset="100%" stop-color="#105A34"/>
    </linearGradient>
    <pattern id="swissGridPat" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D9E5DC" stroke-width="0.75" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="700" fill="url(#skyGrad)"/>
  <!-- Subtle Swiss architectural grid overlay -->
  <rect width="1200" height="500" fill="url(#swissGridPat)"/>

  <!-- Distant Hill & Treeline (Potka / East Singhbhum landscape) -->
  <path d="M 0,380 Q 200,320 400,350 T 800,340 T 1200,360 L 1200,480 L 0,480 Z" fill="#D3E5D8" opacity="0.5"/>
  <path d="M 0,400 Q 300,360 600,380 T 1200,370 L 1200,500 L 0,500 Z" fill="#BFDBC7" opacity="0.6"/>

  <!-- Academic Building - Modern Institutional Architecture -->
  <!-- Left Wing -->
  <rect x="140" y="240" width="280" height="230" fill="url(#buildingGrad)" stroke="#105A34" stroke-width="2"/>
  <rect x="130" y="228" width="300" height="14" fill="url(#roofGrad)"/>
  <!-- Left Wing Windows Grid -->
  <g fill="#105A34" opacity="0.85">
    <rect x="165" y="265" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
    <rect x="225" y="265" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
    <rect x="285" y="265" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
    <rect x="345" y="265" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>

    <rect x="165" y="320" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
    <rect x="225" y="320" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
    <rect x="285" y="320" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
    <rect x="345" y="320" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>

    <rect x="165" y="375" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
    <rect x="225" y="375" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
    <rect x="285" y="375" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
    <rect x="345" y="375" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
  </g>

  <!-- Central Portico & Administration Tower -->
  <rect x="420" y="190" width="360" height="280" fill="#FFFFFF" stroke="#073E28" stroke-width="2.5"/>
  <rect x="405" y="174" width="390" height="18" fill="url(#roofGrad)"/>
  
  <!-- Institutional Pediment & School Name Banner -->
  <rect x="440" y="205" width="320" height="32" fill="#073E28"/>
  <text x="600" y="226" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    CM SOE UPG GOVT+2 SCHOOL VNIKETAN HALDIPOKHAR
  </text>
  <text x="600" y="250" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" fill="#105A34" text-anchor="middle" letter-spacing="1.5">
    HALDIPOKHAR • U-DISE: 20180231602
  </text>

  <!-- Pillars of Main Entrance -->
  <rect x="460" y="300" width="22" height="170" fill="#D9E5DC" stroke="#105A34" stroke-width="1"/>
  <rect x="520" y="300" width="22" height="170" fill="#D9E5DC" stroke="#105A34" stroke-width="1"/>
  <rect x="658" y="300" width="22" height="170" fill="#D9E5DC" stroke="#105A34" stroke-width="1"/>
  <rect x="718" y="300" width="22" height="170" fill="#D9E5DC" stroke="#105A34" stroke-width="1"/>
  <!-- Central Entrance Arch -->
  <path d="M 560,470 L 560,340 C 560,310 640,310 640,340 L 640,470 Z" fill="#073E28"/>
  <path d="M 575,470 L 575,355 C 575,330 625,330 625,355 L 625,470 Z" fill="#E8F3EA" opacity="0.3"/>

  <!-- Right Wing -->
  <rect x="780" y="240" width="280" height="230" fill="url(#buildingGrad)" stroke="#105A34" stroke-width="2"/>
  <rect x="770" y="228" width="300" height="14" fill="url(#roofGrad)"/>
  <!-- Right Wing Windows Grid -->
  <g fill="#105A34" opacity="0.85">
    <rect x="805" y="265" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
    <rect x="865" y="265" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
    <rect x="925" y="265" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
    <rect x="985" y="265" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>

    <rect x="805" y="320" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
    <rect x="865" y="320" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
    <rect x="925" y="320" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
    <rect x="985" y="320" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>

    <rect x="805" y="375" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
    <rect x="865" y="375" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
    <rect x="925" y="375" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
    <rect x="985" y="375" width="40" height="30" rx="2" fill="#E8F3EA" stroke="#105A34" stroke-width="1.5"/>
  </g>

  <!-- National Flagpost in Courtyard -->
  <line x1="600" y1="470" x2="600" y2="120" stroke="#647268" stroke-width="4"/>
  <rect x="585" y="466" width="30" height="8" fill="#1D3024"/>
  <rect x="590" y="460" width="20" height="6" fill="#647268"/>
  <circle cx="600" cy="118" r="5" fill="#E5C158"/>
  <!-- Tricolor waving gently -->
  <path d="M 602,122 C 625,116 635,130 660,122 L 660,135 C 635,143 625,129 602,135 Z" fill="#FF9933"/>
  <path d="M 602,135 C 625,129 635,143 660,135 L 660,148 C 635,156 625,142 602,148 Z" fill="#FFFFFF"/>
  <path d="M 602,148 C 625,142 635,156 660,148 L 660,161 C 635,169 625,155 602,161 Z" fill="#128807"/>
  <circle cx="631" cy="142" r="4" fill="none" stroke="#000088" stroke-width="1"/>

  <!-- Foreground Courtyard & Green Lawn -->
  <polygon points="0,470 1200,470 1200,700 0,700" fill="#F3F8F4"/>
  <polygon points="0,520 1200,520 1200,700 0,700" fill="url(#lawnGrad)"/>
  <!-- Paved Geometric Pathway -->
  <polygon points="480,470 720,470 850,700 350,700" fill="#FFFFFF" stroke="#D9E5DC" stroke-width="2"/>
  <line x1="600" y1="470" x2="600" y2="700" stroke="#105A34" stroke-width="1.5" stroke-dasharray="12 8"/>

  <!-- Green Shrubs and Modern Trees -->
  <!-- Left Side Tree -->
  <circle cx="80" cy="440" r="45" fill="#105A34"/>
  <circle cx="95" cy="415" r="35" fill="#16864A"/>
  <rect x="80" y="440" width="12" height="70" fill="#073E28"/>
  <!-- Right Side Tree -->
  <circle cx="1120" cy="440" r="45" fill="#105A34"/>
  <circle cx="1105" cy="415" r="35" fill="#16864A"/>
  <rect x="1115" y="440" width="12" height="70" fill="#073E28"/>

  <!-- Students walking gracefully (Geometric Modern Silhouettes) -->
  <g transform="translate(420, 560)">
    <!-- Student 1 -->
    <circle cx="20" cy="15" r="8" fill="#1D3024"/>
    <path d="M 12,25 L 28,25 L 26,60 L 14,60 Z" fill="#105A34"/>
    <rect x="15" y="30" width="10" height="14" rx="2" fill="#E5C158"/>
    <!-- Student 2 -->
    <circle cx="50" cy="20" r="8" fill="#1D3024"/>
    <path d="M 42,30 L 58,30 L 56,65 L 44,65 Z" fill="#FFFFFF" stroke="#105A34" stroke-width="1.5"/>
    <line x1="45" y1="42" x2="55" y2="42" stroke="#16864A" stroke-width="2"/>
  </g>
  <g transform="translate(710, 570)">
    <!-- Student 3 with backpack -->
    <circle cx="20" cy="15" r="8" fill="#1D3024"/>
    <path d="M 12,25 L 28,25 L 26,60 L 14,60 Z" fill="#073E28"/>
    <rect x="6" y="28" width="6" height="15" rx="1" fill="#4AA875"/>
  </g>

  <!-- Swiss Editorial Coordinate Badges & Hairline Frame -->
  <rect x="24" y="24" width="1152" height="652" fill="none" stroke="#105A34" stroke-width="1.5" opacity="0.6"/>
  <!-- Swiss Grid Corner Registration Marks -->
  <path d="M 24,40 L 40,40 M 40,24 L 40,40" stroke="#105A34" stroke-width="2.5"/>
  <path d="M 1176,40 L 1160,40 M 1160,24 L 1160,40" stroke="#105A34" stroke-width="2.5"/>
  <path d="M 24,660 L 40,660 M 40,676 L 40,660" stroke="#105A34" stroke-width="2.5"/>
  <path d="M 1176,660 L 1160,660 M 1160,676 L 1160,660" stroke="#105A34" stroke-width="2.5"/>

  <!-- Architectural Label Card Bottom Right -->
  <g transform="translate(930, 600)">
    <rect width="210" height="52" fill="#073E28" rx="2"/>
    <text x="16" y="22" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#4AA875" letter-spacing="2">HALDIPOKHAR CAMPUS</text>
    <text x="16" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">JHARKHAND • 831002</text>
    <circle cx="186" cy="26" r="4" fill="#4AA875"/>
  </g>
</svg>
