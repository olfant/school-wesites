<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#F3F8F4"/>
  <rect x="30" y="30" width="740" height="440" fill="#FFFFFF" stroke="#D9E5DC" stroke-width="2"/>

  <!-- Bookshelves in Background -->
  <rect x="80" y="100" width="280" height="260" fill="#E8F3EA" stroke="#105A34" stroke-width="2"/>
  <line x1="80" y1="160" x2="360" y2="160" stroke="#105A34" stroke-width="3"/>
  <line x1="80" y1="220" x2="360" y2="220" stroke="#105A34" stroke-width="3"/>
  <line x1="80" y1="280" x2="360" y2="280" stroke="#105A34" stroke-width="3"/>

  <!-- Books Rows -->
  <g fill="#105A34">
    <rect x="95" y="115" width="14" height="45" fill="#105A34"/>
    <rect x="112" y="120" width="18" height="40" fill="#16864A"/>
    <rect x="133" y="110" width="12" height="50" fill="#073E28"/>
    <rect x="148" y="118" width="16" height="42" fill="#4AA875"/>
    <rect x="167" y="112" width="20" height="48" fill="#105A34"/>
    <rect x="190" y="122" width="14" height="38" fill="#E5C158"/>
    <rect x="207" y="115" width="16" height="45" fill="#16864A"/>

    <rect x="95" y="175" width="16" height="45" fill="#16864A"/>
    <rect x="114" y="170" width="20" height="50" fill="#105A34"/>
    <rect x="137" y="178" width="14" height="42" fill="#E5C158"/>
    <rect x="154" y="172" width="18" height="48" fill="#073E28"/>
    <rect x="175" y="176" width="16" height="44" fill="#4AA875"/>

    <rect x="95" y="235" width="22" height="45" fill="#073E28"/>
    <rect x="120" y="238" width="14" height="42" fill="#105A34"/>
    <rect x="137" y="232" width="18" height="48" fill="#16864A"/>
    <rect x="158" y="235" width="20" height="45" fill="#4AA875"/>
  </g>

  <!-- Reading Table & Desk -->
  <rect x="420" y="240" width="280" height="18" fill="#105A34"/>
  <rect x="440" y="258" width="16" height="120" fill="#073E28"/>
  <rect x="664" y="258" width="16" height="120" fill="#073E28"/>

  <!-- Student Reading Silhouette -->
  <g transform="translate(480, 180)">
    <circle cx="20" cy="15" r="12" fill="#1D3024"/>
    <path d="M 8,30 C 8,30 20,28 32,30 L 30,60 L 10,60 Z" fill="#105A34"/>
    <!-- Open Book on Desk -->
    <path d="M 28,58 L 48,50 L 68,58 L 48,64 Z" fill="#FFFFFF" stroke="#073E28" stroke-width="1.5"/>
  </g>

  <!-- Desk Lamp -->
  <path d="M 620,240 L 620,180 L 590,190" stroke="#16864A" stroke-width="3" fill="none"/>
  <path d="M 580,185 L 600,195 L 590,205 Z" fill="#E5C158"/>

  <!-- Swiss Header -->
  <rect x="60" y="55" width="160" height="30" fill="#073E28"/>
  <text x="140" y="74" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">LIBRARY HALL • 03</text>
  <text x="400" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#647268" text-anchor="middle">
    School Library &amp; Reference Reading Hall
  </text>
</svg>
