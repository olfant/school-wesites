<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F3EA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyGrad2)"/>
  <!-- Outer hairline frame -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#D9E5DC" stroke-width="1.5"/>

  <!-- Running Track & Field -->
  <ellipse cx="400" cy="340" rx="340" ry="130" fill="#4AA875"/>
  <ellipse cx="400" cy="340" rx="270" ry="95" fill="#F3F8F4" stroke="#FFFFFF" stroke-width="3"/>
  <ellipse cx="400" cy="340" rx="200" ry="65" fill="#105A34"/>

  <!-- Football goal post / Volleyball net -->
  <line x1="280" y1="260" x2="280" y2="330" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="520" y1="260" x2="520" y2="330" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="280" y1="260" x2="520" y2="260" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Athletics Runners Icons -->
  <g transform="translate(370, 310)">
    <circle cx="10" cy="8" r="6" fill="#FFFFFF"/>
    <path d="M 5,16 L 15,16 L 20,34 L 14,46" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
    <path d="M 12,18 L 2,30 L 6,44" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
  </g>
  <g transform="translate(420, 305)">
    <circle cx="10" cy="8" r="6" fill="#E5C158"/>
    <path d="M 5,16 L 15,16 L 22,32 L 18,48" stroke="#E5C158" stroke-width="2.5" fill="none"/>
    <path d="M 12,18 L 4,32 L 8,46" stroke="#E5C158" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Distant campus fence & trees -->
  <line x1="20" y1="220" x2="780" y2="220" stroke="#16864A" stroke-width="1" stroke-dasharray="6 4"/>
  <circle cx="150" cy="200" r="30" fill="#16864A" opacity="0.8"/>
  <circle cx="650" cy="195" r="35" fill="#105A34" opacity="0.8"/>
  <circle cx="700" cy="205" r="25" fill="#4AA875" opacity="0.8"/>

  <!-- Swiss Tag -->
  <rect x="50" y="50" width="180" height="32" fill="#073E28"/>
  <text x="140" y="71" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
    SPORTS GROUNDS • 02
  </text>
  <text x="400" y="460" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#073E28" text-anchor="middle">
    Physical Education, Athletics &amp; Outdoor Activities Field
  </text>
</svg>
