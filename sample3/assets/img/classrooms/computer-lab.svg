<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#F3F8F4"/>
  <rect x="25" y="25" width="750" height="450" fill="#FFFFFF" stroke="#D9E5DC" stroke-width="2"/>

  <!-- Computer Desks -->
  <rect x="80" y="290" width="640" height="25" fill="#073E28"/>
  <rect x="100" y="315" width="20" height="120" fill="#105A34"/>
  <rect x="390" y="315" width="20" height="120" fill="#105A34"/>
  <rect x="680" y="315" width="20" height="120" fill="#105A34"/>

  <!-- Workstation 1 -->
  <g transform="translate(140, 160)">
    <rect x="10" y="10" width="120" height="85" rx="4" fill="#073E28" stroke="#16864A" stroke-width="2"/>
    <rect x="20" y="20" width="100" height="65" fill="#E8F3EA"/>
    <!-- Code / Screen Lines -->
    <line x1="28" y1="35" x2="65" y2="35" stroke="#105A34" stroke-width="3"/>
    <line x1="28" y1="45" x2="95" y2="45" stroke="#16864A" stroke-width="2"/>
    <line x1="28" y1="55" x2="80" y2="55" stroke="#4AA875" stroke-width="2"/>
    <line x1="28" y1="65" x2="50" y2="65" stroke="#E5C158" stroke-width="2"/>
    <!-- Stand -->
    <rect x="62" y="95" width="16" height="25" fill="#647268"/>
    <rect x="45" y="120" width="50" height="8" rx="2" fill="#1D3024"/>
    <!-- Keyboard -->
    <rect x="20" y="123" width="100" height="6" rx="1" fill="#647268"/>
  </g>

  <!-- Workstation 2 -->
  <g transform="translate(340, 160)">
    <rect x="10" y="10" width="120" height="85" rx="4" fill="#073E28" stroke="#16864A" stroke-width="2"/>
    <rect x="20" y="20" width="100" height="65" fill="#E8F3EA"/>
    <!-- Screen graphic -->
    <circle cx="70" cy="52" r="18" fill="none" stroke="#105A34" stroke-width="2"/>
    <line x1="70" y1="34" x2="70" y2="70" stroke="#16864A" stroke-width="1.5"/>
    <line x1="52" y1="52" x2="88" y2="52" stroke="#16864A" stroke-width="1.5"/>
    <!-- Stand -->
    <rect x="62" y="95" width="16" height="25" fill="#647268"/>
    <rect x="45" y="120" width="50" height="8" rx="2" fill="#1D3024"/>
    <!-- Keyboard -->
    <rect x="20" y="123" width="100" height="6" rx="1" fill="#647268"/>
  </g>

  <!-- Workstation 3 -->
  <g transform="translate(540, 160)">
    <rect x="10" y="10" width="120" height="85" rx="4" fill="#073E28" stroke="#16864A" stroke-width="2"/>
    <rect x="20" y="20" width="100" height="65" fill="#E8F3EA"/>
    <!-- Bar chart on screen -->
    <rect x="35" y="55" width="10" height="20" fill="#105A34"/>
    <rect x="52" y="42" width="10" height="33" fill="#16864A"/>
    <rect x="69" y="32" width="10" height="43" fill="#4AA875"/>
    <rect x="86" y="48" width="10" height="27" fill="#E5C158"/>
    <!-- Stand -->
    <rect x="62" y="95" width="16" height="25" fill="#647268"/>
    <rect x="45" y="120" width="50" height="8" rx="2" fill="#1D3024"/>
    <!-- Keyboard -->
    <rect x="20" y="123" width="100" height="6" rx="1" fill="#647268"/>
  </g>

  <!-- Swiss Header -->
  <rect x="50" y="50" width="190" height="30" fill="#073E28"/>
  <text x="145" y="70" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">ICT &amp; VOCATIONAL • 06</text>
  <text x="400" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#647268" text-anchor="middle">
    Information &amp; Communication Technology / Digital Literacy Center
  </text>
</svg>
