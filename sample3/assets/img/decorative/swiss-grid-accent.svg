<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#D9E5DC" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="none"/>
  <rect width="400" height="400" fill="url(#smallGrid)"/>
  <!-- Prominent Swiss Crosses at Grid Intersections -->
  <path d="M 95,100 L 105,100 M 100,95 L 100,105" stroke="#105A34" stroke-width="2"/>
  <path d="M 295,100 L 305,100 M 300,95 L 300,105" stroke="#105A34" stroke-width="2"/>
  <path d="M 195,200 L 205,200 M 200,195 L 200,205" stroke="#16864A" stroke-width="2"/>
  <path d="M 95,300 L 105,300 M 100,295 L 100,305" stroke="#105A34" stroke-width="2"/>
  <path d="M 295,300 L 305,300 M 300,295 L 300,305" stroke="#105A34" stroke-width="2"/>
  <circle cx="200" cy="200" r="80" fill="none" stroke="#105A34" stroke-width="1" stroke-dasharray="4 4"/>
</svg>
