  <rect x="390" y="256" width="20" height="8" fill="#1D3024"/>
  <!-- Tricolor -->
  <path d="M 402,82 C 418,78 426,86 442,82 L 442,91 C 426,95 418,87 402,91 Z" fill="#FF9933"/>
  <path d="M 402,91 C 418,87 426,95 442,91 L 442,100 C 426,104 418,96 402,100 Z" fill="#FFFFFF"/>
  <path d="M 402,100 C 418,96 426,104 442,100 L 442,109 C 426,113 418,105 402,109 Z" fill="#128807"/>

  <!-- Orderly Ranks of Students in Uniform -->
