      <circle cx="30" cy="15" r="9" fill="#1D3024"/>
      <rect x="23" y="26" width="14" height="40" rx="2"/>
      <circle cx="30" cy="85" r="9" fill="#1D3024"/>
      <rect x="23" y="96" width="14" height="40" rx="2"/>
      <circle cx="30" cy="155" r="9" fill="#1D3024"/>
      <rect x="23" y="166" width="14" height="40" rx="2"/>
    </g>
    <!-- Column 5 -->
    <g fill="#16864A">
      <circle cx="80" cy="15" r="9" fill="#1D3024"/>
      <rect x="73" y="26" width="14" height="40" rx="2"/>
      <circle cx="80" cy="85" r="9" fill="#1D3024"/>
      <rect x="73" y="96" width="14" height="40" rx="2"/>
      <circle cx="80" cy="155" r="9" fill="#1D3024"/>
