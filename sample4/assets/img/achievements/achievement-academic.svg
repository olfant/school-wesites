<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="achAcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063F27"/>
      <stop offset="60%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#16864A"/>
    </linearGradient>
    <linearGradient id="goldM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E076"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#achAcGrad)"/>
  <rect x="60" y="60" width="680" height="480" rx="20" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)"/>

  <!-- Trophy Graphic -->
  <g transform="translate(400, 220)">
    <!-- Trophy Cup -->
    <path d="M-30,-40 L30,-40 L25,0 C25,20 15,30 0,35 C-15,30 -25,20 -25,0 Z" fill="url(#goldM)"/>
    <path d="M-30,-30 C-45,-30 -45,-5 -25,-5" fill="none" stroke="url(#goldM)" stroke-width="5"/>
    <path d="M30,-30 C45,-30 45,-5 25,-5" fill="none" stroke="url(#goldM)" stroke-width="5"/>
    <!-- Stem and Base -->
    <rect x="-6" y="35" width="12" height="20" fill="#AA771C"/>
    <rect x="-24" y="55" width="48" height="15" rx="3" fill="#D4AF37"/>
    <!-- Star on Trophy -->
    <circle cx="0" cy="-5" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <g transform="translate(100, 410)">
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#43A76D"/>
    <text x="85" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      ACADEMIC MERIT
    </text>
    <text x="0" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">
      Scholastic Honors &amp; Board Results
    </text>
    <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#D9F0DF">
      Recognizing student hard work, conceptual mastery and secondary examination success
    </text>
  </g>
</svg>