<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="achCultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063F27"/>
      <stop offset="60%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#16864A"/>
    </linearGradient>
    <linearGradient id="goldCl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E076"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#achCultGrad)"/>
  <rect x="60" y="60" width="680" height="480" rx="20" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)"/>

  <!-- Certificate / Laurel Graphic -->
  <g transform="translate(400, 220)">
    <!-- Scroll / Certificate -->
    <rect x="-40" y="-35" width="80" height="60" rx="4" fill="#FFFFFF"/>
    <line x1="-30" y1="-20" x2="30" y2="-20" stroke="#105A34" stroke-width="3"/>
    <line x1="-30" y1="-10" x2="20" y2="-10" stroke="#718075" stroke-width="2"/>
    <line x1="-30" y1="0" x2="25" y2="0" stroke="#718075" stroke-width="2"/>
    <circle cx="20" cy="12" r="8" fill="url(#goldCl)"/>
    <!-- Laurel Wreath -->
    <path d="M-60,10 C-60,-40 -20,-50 0,-50 C20,-50 60,-40 60,10" fill="none" stroke="#D4AF37" stroke-width="3" stroke-dasharray="6 4"/>
  </g>

  <!-- Typography -->
  <g transform="translate(100, 410)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#43A76D"/>
    <text x="90" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      CULTURAL MERIT
    </text>
    <text x="0" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">
      Creative &amp; Youth Festival Laurels
    </text>
    <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#D9F0DF">
      Excellence in folk dance, dramatic arts, public speaking and youth exhibitions
    </text>
  </g>
</svg>