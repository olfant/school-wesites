<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063F27"/>
      <stop offset="60%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#16864A"/>
    </linearGradient>
    <linearGradient id="cultCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cultGrad)"/>
  <rect x="60" y="60" width="680" height="480" rx="20" fill="url(#cultCard)" stroke="rgba(255,255,255,0.2)"/>

  <!-- Cultural Art / Music / Folk Dance Graphic -->
  <g transform="translate(400, 220)">
    <!-- Glowing Ring -->
    <circle cx="0" cy="0" r="95" fill="rgba(217, 240, 223, 0.12)"/>
    <circle cx="0" cy="0" r="70" fill="rgba(255, 255, 255, 0.18)" stroke="#D9F0DF" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="#FFFFFF"/>
    
    <!-- Stylized Nataraja / Classical Dance Silhouette & Musical Note -->
    <g fill="#063F27">
      <path d="M-15,10 C-10,-20 10,-20 15,10 C5,0 -5,0 -15,10 Z"/>
      <circle cx="0" cy="-28" r="7" fill="#AA771C"/>
      <path d="M-25,-5 Q0,-20 25,-5 Q0,-10 -25,-5 Z"/>
      <path d="M-8,12 L-15,35 L0,25 L15,35 L8,12 Z" fill="#105A34"/>
    </g>
    <!-- Musical notes -->
    <circle cx="-65" cy="-30" r="8" fill="#F9E076"/>
    <rect x="-57" y="-55" width="4" height="25" fill="#F9E076"/>
    <circle cx="65" cy="-20" r="8" fill="#F9E076"/>
    <rect x="73" y="-45" width="4" height="25" fill="#F9E076"/>
  </g>

  <!-- Typography -->
  <g transform="translate(100, 410)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#43A76D"/>
    <text x="70" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      CULTURE
    </text>
    <text x="0" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">
      Cultural Celebrations &amp; Arts
    </text>
    <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#D9F0DF">
      Music, folk dance, theater, heritage festivals and creative performing arts
    </text>
  </g>
</svg>