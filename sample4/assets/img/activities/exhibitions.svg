<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="exhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063F27"/>
      <stop offset="60%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#16864A"/>
    </linearGradient>
    <linearGradient id="exhCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#exhGrad)"/>
  <rect x="60" y="60" width="680" height="480" rx="20" fill="url(#exhCard)" stroke="rgba(255,255,255,0.2)"/>

  <!-- Exhibition / Model Graphic -->
  <g transform="translate(400, 220)">
    <circle cx="0" cy="0" r="95" fill="rgba(217, 240, 223, 0.12)"/>
    <circle cx="0" cy="0" r="70" fill="rgba(255, 255, 255, 0.18)" stroke="#D9F0DF" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="#FFFFFF"/>
    
    <!-- Model & Lightbulb Innovation Icon -->
    <path d="M-12,-15 C-18,-25 18,-25 12,-15 C10,-8 6,-5 6,5 L-6,5 C-6,-5 -10,-8 -12,-15 Z" fill="#D4AF37"/>
    <rect x="-6" y="7" width="12" height="4" fill="#063F27"/>
    <rect x="-4" y="13" width="8" height="3" fill="#063F27"/>
    <!-- Solar model gears -->
    <circle cx="-50" cy="15" r="14" fill="none" stroke="#F9E076" stroke-width="3" stroke-dasharray="4 3"/>
    <circle cx="50" cy="15" r="14" fill="none" stroke="#D9F0DF" stroke-width="3" stroke-dasharray="4 3"/>
  </g>

  <!-- Typography -->
  <g transform="translate(100, 410)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#43A76D"/>
    <text x="80" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      EXHIBITIONS
    </text>
    <text x="0" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">
      Science &amp; Educational Fairs
    </text>
    <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#D9F0DF">
      Innovative working models, environmental displays, art &amp; craft exhibitions
    </text>
  </g>
</svg>