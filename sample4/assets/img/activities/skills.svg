<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063F27"/>
      <stop offset="60%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#16864A"/>
    </linearGradient>
    <linearGradient id="skCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#skGrad)"/>
  <rect x="60" y="60" width="680" height="480" rx="20" fill="url(#skCard)" stroke="rgba(255,255,255,0.2)"/>

  <!-- Skills Graphic: Gear & Lightning -->
  <g transform="translate(400, 220)">
    <circle cx="0" cy="0" r="95" fill="rgba(217, 240, 223, 0.12)"/>
    <circle cx="0" cy="0" r="70" fill="rgba(255, 255, 255, 0.18)" stroke="#D9F0DF" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="#FFFFFF"/>
    
    <!-- Cog / Gear -->
    <path d="M-8,-38 L8,-38 L6,-30 L-6,-30 Z M-8,38 L8,38 L6,30 L-6,30 Z M-38,-8 L-38,8 L-30,6 L-30,-6 Z M38,-8 L38,8 L30,6 L30,-6 Z" fill="#105A34"/>
    <circle cx="0" cy="0" r="28" fill="#16864A"/>
    <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
    <!-- Lightning Bolt -->
    <polygon points="-4,-18 4,-18 -2,-2 6,-2 -4,18 0,4 -6,4" fill="#D4AF37"/>
  </g>

  <!-- Typography -->
  <g transform="translate(100, 410)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#43A76D"/>
    <text x="90" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      SKILLS COMPETITION
    </text>
    <text x="0" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">
      Talent &amp; Skill Competitions
    </text>
    <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#D9F0DF">
      Debating, creative writing, quiz contests, digital skills and problem solving
    </text>
  </g>
</svg>