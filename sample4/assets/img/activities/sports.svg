<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="spGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063F27"/>
      <stop offset="60%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#16864A"/>
    </linearGradient>
    <linearGradient id="spCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#spGrad)"/>
  <rect x="60" y="60" width="680" height="480" rx="20" fill="url(#spCard)" stroke="rgba(255,255,255,0.2)"/>

  <!-- Sports Graphic: Runner silhouette & Athletic Laurel -->
  <g transform="translate(400, 220)">
    <circle cx="0" cy="0" r="95" fill="rgba(217, 240, 223, 0.12)"/>
    <circle cx="0" cy="0" r="70" fill="rgba(255, 255, 255, 0.18)" stroke="#D9F0DF" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="#FFFFFF"/>
    
    <!-- Sprinter Icon -->
    <circle cx="15" cy="-25" r="7" fill="#063F27"/>
    <path d="M-15,15 L-5,-5 L15,-10 L5,15 Z" fill="#063F27"/>
    <path d="M-5,-5 L-25,-12 L-30,-2" stroke="#063F27" stroke-width="4" stroke-linecap="round"/>
    <path d="M15,-10 L30,-5 L25,10" stroke="#063F27" stroke-width="4" stroke-linecap="round"/>
    <path d="M-15,15 L-25,35" stroke="#AA771C" stroke-width="4" stroke-linecap="round"/>
    <path d="M5,15 L15,30 L30,32" stroke="#AA771C" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(100, 410)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#43A76D"/>
    <text x="70" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      SPORTS
    </text>
    <text x="0" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">
      Sports &amp; Physical Fitness
    </text>
    <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#D9F0DF">
      Track athletics, team football, volleyball, badminton and annual sports meets
    </text>
  </g>
</svg>