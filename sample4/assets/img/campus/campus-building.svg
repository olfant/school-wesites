<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063F27"/>
      <stop offset="60%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#16864A"/>
    </linearGradient>
    <linearGradient id="cbCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cbGrad)"/>
  <rect x="60" y="60" width="680" height="480" rx="20" fill="url(#cbCard)" stroke="rgba(255,255,255,0.18)"/>

  <!-- Building Graphic -->
  <g transform="translate(400, 240)">
    <rect x="-240" y="-80" width="480" height="200" rx="8" fill="#F5F9F6"/>
    <rect x="-250" y="-95" width="500" height="18" fill="#063F27"/>
    <g fill="#105A34">
      <rect x="-210" y="-60" width="40" height="50" rx="4"/>
      <rect x="-150" y="-60" width="40" height="50" rx="4"/>
      <rect x="-90" y="-60" width="40" height="50" rx="4"/>
      <rect x="50" y="-60" width="40" height="50" rx="4"/>
      <rect x="110" y="-60" width="40" height="50" rx="4"/>
      <rect x="170" y="-60" width="40" height="50" rx="4"/>

      <rect x="-210" y="20" width="40" height="50" rx="4"/>
      <rect x="-150" y="20" width="40" height="50" rx="4"/>
      <rect x="-90" y="20" width="40" height="50" rx="4"/>
      <rect x="50" y="20" width="40" height="50" rx="4"/>
      <rect x="110" y="20" width="40" height="50" rx="4"/>
      <rect x="170" y="20" width="40" height="50" rx="4"/>
    </g>
    <rect x="-30" y="-20" width="60" height="140" fill="#E8F1EC" stroke="#105A34"/>
    <path d="M-15,120 L-15,30 Q0,10 15,30 L15,120 Z" fill="#063F27"/>
  </g>

  <!-- Info -->
  <g transform="translate(100, 410)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#43A76D"/>
    <text x="80" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      INFRASTRUCTURE
    </text>
    <text x="0" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">
      Senior Secondary Academic Wing
    </text>
    <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#D9F0DF">
      Well-ventilated classrooms, administrative offices & faculty chambers
    </text>
  </g>
