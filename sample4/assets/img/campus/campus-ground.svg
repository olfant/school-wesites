<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063F27"/>
      <stop offset="60%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#16864A"/>
    </linearGradient>
    <linearGradient id="grdCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#grdGrad)"/>
  <rect x="60" y="60" width="680" height="480" rx="20" fill="url(#grdCard)" stroke="rgba(255,255,255,0.18)"/>

  <!-- Sports Field Graphic -->
  <g transform="translate(400, 230)">
    <!-- Track Oval -->
    <ellipse cx="0" cy="0" rx="180" ry="90" fill="none" stroke="#D4AF37" stroke-width="8"/>
    <ellipse cx="0" cy="0" rx="150" ry="70" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="120" ry="50" fill="#16864A" stroke="#FFFFFF" stroke-dasharray="6 4" stroke-width="2"/>
    
    <!-- Goalposts / Volleyball Net -->
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#FFFFFF" stroke-width="3"/>
    
    <!-- Sports Balls -->
    <circle cx="-50" cy="0" r="16" fill="#FFFFFF" stroke="#063F27" stroke-width="2"/>
    <circle cx="50" cy="0" r="14" fill="#AA771C" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- Info -->
  <g transform="translate(100, 410)">
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#43A76D"/>
    <text x="85" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      SPORTS GROUND
    </text>
    <text x="0" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">
      Athletics & Sports Field
    </text>
    <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#D9F0DF">
      Spacious playground for outdoor games, athletics, yoga and physical drills
    </text>
  </g>
</svg>