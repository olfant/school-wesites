<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="libGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063F27"/>
      <stop offset="60%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#16864A"/>
    </linearGradient>
    <linearGradient id="libCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#libGrad)"/>
  <rect x="60" y="60" width="680" height="480" rx="20" fill="url(#libCard)" stroke="rgba(255,255,255,0.18)"/>

  <!-- Bookshelf Graphic -->
  <g transform="translate(400, 230)">
    <rect x="-200" y="-80" width="400" height="180" rx="6" fill="#063F27" stroke="#43A76D" stroke-width="2"/>
    <line x1="-200" y1="-20" x2="200" y2="-20" stroke="#43A76D" stroke-width="3"/>
    <line x1="-200" y1="40" x2="200" y2="40" stroke="#43A76D" stroke-width="3"/>
    
    <!-- Row 1 Books -->
    <rect x="-180" y="-75" width="22" height="52" fill="#D4AF37"/>
    <rect x="-155" y="-70" width="18" height="47" fill="#D9F0DF"/>
    <rect x="-134" y="-75" width="25" height="52" fill="#43A76D"/>
    <rect x="-106" y="-68" width="20" height="45" fill="#F9E076"/>
    <rect x="-83" y="-75" width="24" height="52" fill="#FFFFFF"/>
    <rect x="50" y="-75" width="20" height="52" fill="#D4AF37"/>
    <rect x="73" y="-72" width="24" height="49" fill="#D9F0DF"/>
    <rect x="100" y="-75" width="18" height="52" fill="#43A76D"/>
    <rect x="121" y="-70" width="26" height="47" fill="#F9E076"/>

    <!-- Row 2 Books -->
    <rect x="-170" y="-15" width="25" height="52" fill="#D9F0DF"/>
    <rect x="-142" y="-18" width="22" height="55" fill="#D4AF37"/>
    <rect x="-117" y="-12" width="20" height="49" fill="#FFFFFF"/>
    <rect x="-94" y="-18" width="28" height="55" fill="#43A76D"/>
    <rect x="40" y="-18" width="22" height="55" fill="#43A76D"/>
    <rect x="65" y="-12" width="26" height="49" fill="#D9F0DF"/>
    <rect x="94" y="-18" width="18" height="55" fill="#D4AF37"/>
    <rect x="115" y="-15" width="25" height="52" fill="#F9E076"/>

    <!-- Study Lamp -->
    <circle cx="0" cy="8" r="16" fill="#F9E076"/>
    <path d="M-8,14 L8,14 L4,36 L-4,36 Z" fill="#D4AF37"/>
  </g>

  <!-- Info -->
  <g transform="translate(100, 410)">
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#43A76D"/>
    <text x="85" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      LIBRARY & READING
    </text>
    <text x="0" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">
      School Knowledge Center
    </text>
    <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#D9F0DF">
      Textbooks, reference volumes, periodicals and quiet learning environment
    </text>
  </g>
</svg>