<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063F27"/>
      <stop offset="60%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#16864A"/>
    </linearGradient>
    <linearGradient id="sgCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sgGrad)"/>
  <rect x="60" y="60" width="680" height="480" rx="20" fill="url(#sgCard)" stroke="rgba(255,255,255,0.18)"/>

  <!-- Group Collaboration Graphic -->
  <g transform="translate(400, 230)">
    <circle cx="0" cy="0" r="90" fill="none" stroke="#D9F0DF" stroke-width="2"/>
    <!-- Central Project Board -->
    <rect x="-35" y="-35" width="70" height="70" rx="8" fill="#F9E076"/>
    <!-- Student Avatars around circular table -->
    <circle cx="0" cy="-65" r="16" fill="#FFFFFF"/>
    <circle cx="65" cy="0" r="16" fill="#FFFFFF"/>
    <circle cx="0" cy="65" r="16" fill="#FFFFFF"/>
    <circle cx="-65" cy="0" r="16" fill="#FFFFFF"/>
  </g>

  <!-- Info -->
  <g transform="translate(100, 410)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#43A76D"/>
    <text x="90" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      COLLABORATION
    </text>
    <text x="0" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">
      Collaborative Peer Study
    </text>
    <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#D9F0DF">
      Team spirit, interactive problem solving and collective academic achievement
    </text>
  </g>
</svg>