<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#064525"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#cultGrad)"/>
  <!-- Stage light beams -->
  <polygon points="100,0 200,400 0,400" fill="#F9D423" opacity="0.15"/>
  <polygon points="500,0 600,400 400,400" fill="#F9D423" opacity="0.15"/>
  <!-- Indian Classical Musical Instruments (Tabla & Tanpura / Veena) -->
  <g transform="translate(180, 140)">
    <!-- Tabla Pair -->
    <ellipse cx="90" cy="140" rx="35" ry="15" fill="#4E342E"/>
    <ellipse cx="90" cy="140" rx="20" ry="8" fill="#212121"/>
    <path d="M 55,140 L 65,190 L 115,190 L 125,140 Z" fill="#8D6E63" stroke="#4E342E" stroke-width="2"/>
    <!-- Dagga -->
    <ellipse cx="170" cy="145" rx="42" ry="18" fill="#5D4037"/>
    <ellipse cx="170" cy="145" rx="24" ry="10" fill="#212121"/>
    <path d="M 128,145 L 138,200 L 202,200 L 212,145 Z" fill="#BCAAA4" stroke="#5D4037" stroke-width="2"/>
  </g>
  <!-- Classical Dance Mudra Silhouette / Ghungroo -->
  <g transform="translate(260, 60)" fill="#F9D423">
    <circle cx="40" cy="40" r="14"/>
    <path d="M 30,55 L 50,55 L 60,110 L 20,110 Z"/>
    <path d="M 30,65 L 0,85 L 10,95 L 35,75 Z"/>
    <path d="M 50,65 L 80,45 L 90,55 L 55,75 Z"/>
  </g>
  <!-- Card Text -->
  <rect x="40" y="290" width="520" height="80" rx="8" fill="#042614" stroke="#16864A" stroke-width="1.5"/>
  <text x="300" y="325" font-family="'Hind', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">सांस्कृतिक गतिविधियाँ</text>
  <text x="300" y="352" font-family="'Poppins', sans-serif" font-size="14" fill="#F9D423" text-anchor="middle">Cultural Programs, Music, Dance &amp; Festivals</text>
</svg>