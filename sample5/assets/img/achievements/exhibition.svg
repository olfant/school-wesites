  <text x="300" y="325" font-family="'Hind', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">विज्ञान एवं कला प्रदर्शनी</text>
  <text x="300" y="352" font-family="'Poppins', sans-serif" font-size="14" fill="#F9D423" text-anchor="middle">Science, Art &amp; Craft Exhibitions</text>
