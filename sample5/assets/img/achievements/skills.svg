<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064525"/>
      <stop offset="100%" stop-color="#16864A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#skGrad)"/>
  <!-- Gears / Cogs of Skills & Engineering -->
  <g transform="translate(240, 70)" fill="#F9D423" stroke="#B78103" stroke-width="2">
    <!-- Big Gear -->
    <circle cx="60" cy="70" r="35"/>
    <circle cx="60" cy="70" r="15" fill="#064525"/>
    <!-- Teeth -->
    <rect x="52" y="24" width="16" height="15" rx="3"/>
    <rect x="52" y="101" width="16" height="15" rx="3"/>
    <rect x="14" y="62" width="15" height="16" rx="3"/>
    <rect x="91" y="62" width="15" height="16" rx="3"/>
    <!-- Small Meshed Gear -->
    <g transform="translate(70, 70)" fill="#EAF5ED" stroke="#105A34">
      <circle cx="45" cy="50" r="24"/>
      <circle cx="45" cy="50" r="10" fill="#064525"/>
      <rect x="40" y="18" width="10" height="10" rx="2"/>
      <rect x="40" y="72" width="10" height="10" rx="2"/>
      <rect x="13" y="45" width="10" height="10" rx="2"/>
      <rect x="67" y="45" width="10" height="10" rx="2"/>
    </g>
  </g>
  <!-- Card Text -->
  <rect x="40" y="290" width="520" height="80" rx="8" fill="#042614" stroke="#16864A" stroke-width="1.5"/>
  <text x="300" y="325" font-family="'Hind', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">कौशल प्रतियोगिताएँ</text>
  <text x="300" y="352" font-family="'Poppins', sans-serif" font-size="14" fill="#F9D423" text-anchor="middle">Skills, Quizzes, Debates &amp; Innovation Competitions</text>
</svg>