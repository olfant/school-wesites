<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="spGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064525"/>
      <stop offset="100%" stop-color="#16864A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#spGrad)"/>
  <!-- Gold Medal & Ribbons -->
  <g transform="translate(230, 50)">
    <path d="M 50,0 L 20,110 L 50,95 L 80,110 Z" fill="#1E88E5"/>
    <path d="M 90,0 L 60,110 L 90,95 L 120,110 Z" fill="#E53935"/>
    <!-- Gold Medal Disc -->
    <circle cx="70" cy="130" r="46" fill="#F9D423" stroke="#F57F17" stroke-width="4"/>
    <circle cx="70" cy="130" r="36" fill="none" stroke="#FFF9C4" stroke-width="2"/>
    <polygon points="70,110 75,123 90,123 78,132 82,146 70,137 58,146 62,132 50,123 65,123" fill="#F57F17"/>
    <text x="70" y="165" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#E65100" text-anchor="middle">1st PLACE</text>
  </g>
  <!-- Badminton / Football gear silhouettes -->
  <g stroke="#EAF5ED" stroke-width="2" fill="none" opacity="0.6">
    <circle cx="100" cy="180" r="30"/>
    <line x1="120" y1="200" x2="160" y2="240"/>
    <circle cx="500" cy="180" r="35"/>
  </g>
  <!-- Card Text -->
  <rect x="40" y="290" width="520" height="80" rx="8" fill="#042614" stroke="#16864A" stroke-width="1.5"/>
  <text x="300" y="325" font-family="'Hind', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">खेलकूद उपलब्धियाँ</text>
  <text x="300" y="352" font-family="'Poppins', sans-serif" font-size="14" fill="#F9D423" text-anchor="middle">Sports &amp; Athletics Championships</text>
</svg>