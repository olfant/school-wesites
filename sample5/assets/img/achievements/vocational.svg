<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="vocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#042614"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#vocGrad)"/>
  <!-- Vocational Tools (Wrench, Ruler, Circuit symbol) -->
  <g transform="translate(230, 70)">
    <!-- Crossed Wrench & Screwdriver -->
    <path d="M 40,40 L 100,120 L 85,135 L 25,55 Z" fill="#CFD8DC" stroke="#37474F" stroke-width="2"/>
    <circle cx="30" cy="45" r="16" fill="#CFD8DC" stroke="#37474F" stroke-width="2"/>
    <path d="M 100,40 L 40,120 L 55,135 L 115,55 Z" fill="#FFA726" stroke="#E65100" stroke-width="2"/>
    <rect x="95" y="30" width="25" height="15" rx="3" fill="#B0BEC5"/>
  </g>
  <!-- Certificate / Diploma ribbon icon -->
  <g transform="translate(100, 90)">
    <rect x="0" y="0" width="60" height="45" rx="4" fill="#FFFFFF" stroke="#F9D423" stroke-width="2"/>
    <line x1="10" y1="12" x2="50" y2="12" stroke="#105A34" stroke-width="2"/>
    <line x1="10" y1="22" x2="40" y2="22" stroke="#105A34" stroke-width="2"/>
    <circle cx="45" cy="35" r="6" fill="#E53935"/>
  </g>
  <!-- Card Text -->
  <rect x="40" y="290" width="520" height="80" rx="8" fill="#042614" stroke="#16864A" stroke-width="1.5"/>
  <text x="300" y="325" font-family="'Hind', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">व्यावसायिक गतिविधियाँ</text>
  <text x="300" y="352" font-family="'Poppins', sans-serif" font-size="14" fill="#F9D423" text-anchor="middle">Vocational Education &amp; Hands-on Trades Training</text>
</svg>