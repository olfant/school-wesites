<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="labgrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064525"/>
      <stop offset="100%" stop-color="#105A34"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#labgrad)"/>
  <!-- Title Badge -->
  <rect x="200" y="40" width="400" height="70" rx="8" fill="#042816" stroke="#F9D423" stroke-width="2"/>
  <text x="400" y="72" font-family="'Hind', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">विज्ञान एवं कम्प्यूटर प्रयोगशाला</text>
  <text x="400" y="95" font-family="'Poppins', sans-serif" font-size="13" font-weight="500" fill="#F9D423" text-anchor="middle">Science &amp; ICT Computer Laboratory</text>
  <!-- Modern Computer Monitor & Keyboard -->
  <rect x="150" y="160" width="220" height="150" rx="6" fill="#1C3125" stroke="#EAF5ED" stroke-width="3"/>
  <rect x="165" y="175" width="190" height="120" rx="4" fill="#083820"/>
  <text x="260" y="225" font-family="'Poppins', sans-serif" font-size="14" fill="#69F0AE" text-anchor="middle">&lt;code&gt; Digital Literacy &lt;/code&gt;</text>
  <text x="260" y="255" font-family="'Poppins', sans-serif" font-size="12" fill="#EAF5ED" text-anchor="middle">ICT Training for Students</text>
  <rect x="245" y="310" width="30" height="40" fill="#CFD8DC"/>
  <polygon points="210,350 310,350 320,355 200,355" fill="#90A4AE"/>
  <!-- Physics & Chemistry Glassware & Apparatus -->
  <g transform="translate(460, 160)">
    <!-- Flask -->
    <path d="M 60,30 L 75,30 L 75,70 L 115,140 C 120,150 112,160 100,160 L 35,160 C 23,160 15,150 20,140 L 60,70 Z" fill="#EAF5ED" opacity="0.3" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 27,145 L 108,145 C 113,145 116,151 113,155 L 103,160 L 32,160 C 25,160 23,154 27,145 Z" fill="#FFAB00" opacity="0.8"/>
    <!-- Burette / Stand -->
    <rect x="150" y="10" width="8" height="180" fill="#B0BEC5"/>
    <rect x="130" y="180" width="70" height="15" rx="3" fill="#37474F"/>
    <rect x="175" y="20" width="12" height="120" rx="6" fill="#00E676" opacity="0.7" stroke="#FFFFFF"/>
  </g>
  <!-- Work bench table -->
  <rect y="360" width="800" height="140" fill="#031c0e" stroke="#16864A" stroke-width="2"/>
  <text x="400" y="430" font-family="'Poppins', sans-serif" font-size="15" fill="#EAF5ED" text-anchor="middle">Hands-on Experiments • Safe Laboratory Environment • Experienced Faculty</text>
</svg>