<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyPlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80CBC4"/>
      <stop offset="60%" stop-color="#EAF5ED"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="240" fill="url(#skyPlay)"/>
  <!-- Distant trees -->
  <circle cx="100" cy="240" r="70" fill="#1B5E20" opacity="0.6"/>
  <circle cx="250" cy="230" r="90" fill="#2E7D32" opacity="0.7"/>
  <circle cx="500" cy="225" r="95" fill="#1B5E20" opacity="0.6"/>
  <circle cx="700" cy="240" r="80" fill="#2E7D32" opacity="0.7"/>
  <!-- Field Turf -->
  <rect y="240" width="800" height="260" fill="#105A34"/>
  <!-- Running Track lines -->
  <path d="M 0,380 Q 400,280 800,380" fill="none" stroke="#DCE8DF" stroke-width="4" stroke-dasharray="8,6"/>
  <path d="M 0,440 Q 400,330 800,440" fill="none" stroke="#DCE8DF" stroke-width="4" stroke-dasharray="8,6"/>
  <!-- Football Goal Post -->
  <g stroke="#FFFFFF" stroke-width="4" fill="none">
    <line x1="280" y1="280" x2="280" y2="210"/>
    <line x1="520" y1="280" x2="520" y2="210"/>
    <line x1="280" y1="210" x2="520" y2="210"/>
    <!-- Goal Net Lines -->
    <path d="M 280,210 L 260,240 L 260,300 L 280,280" stroke-width="2" opacity="0.5"/>
    <path d="M 520,210 L 540,240 L 540,300 L 520,280" stroke-width="2" opacity="0.5"/>
  </g>
  <!-- Football -->
  <circle cx="400" cy="330" r="24" fill="#FFFFFF" stroke="#064525" stroke-width="2"/>
  <polygon points="400,320 408,326 405,336 395,336 392,326" fill="#105A34"/>
  <!-- Title Badge -->
  <rect x="230" y="30" width="340" height="65" rx="8" fill="#064525" stroke="#F9D423" stroke-width="2"/>
  <text x="400" y="58" font-family="'Hind', sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">विद्यालय खेल मैदान</text>
  <text x="400" y="80" font-family="'Poppins', sans-serif" font-size="12" font-weight="500" fill="#F9D423" text-anchor="middle">Sports Complex &amp; Athletics Ground</text>
</svg>