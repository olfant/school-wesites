<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064525"/>
      <stop offset="60%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#16864A"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAF5ED"/>
    </linearGradient>
    <linearGradient id="lawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16864A"/>
      <stop offset="100%" stop-color="#0a3c20"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="650" fill="url(#skyGrad)"/>
  
  <!-- Subtle geometric overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5">
    <circle cx="200" cy="150" r="120" fill="none"/>
    <circle cx="200" cy="150" r="220" fill="none"/>
    <circle cx="1050" cy="200" r="180" fill="none"/>
    <path d="M 0,350 L 1200,200" />
    <path d="M 0,450 L 1200,300" />
  </g>

  <!-- Distant Hill & Trees (Haldipokhar landscape) -->
  <path d="M 0,420 Q 250,340 500,390 T 1000,360 Q 1120,380 1200,400 L 1200,650 L 0,650 Z" fill="#0c4b2a" opacity="0.7"/>
  <path d="M 0,460 Q 300,410 650,440 T 1200,430 L 1200,650 L 0,650 Z" fill="#08381c" opacity="0.8"/>

  <!-- School Building Complex -->
  <g id="campusBuilding" transform="translate(180, 240)">
    <!-- Main Center Wing -->
    <rect x="220" y="80" width="400" height="180" rx="4" fill="url(#buildingGrad)" stroke="#105A34" stroke-width="2"/>
    <polygon points="210,80 420,10 630,80" fill="#105A34"/>
    <polygon points="230,80 420,20 610,80" fill="#16864A"/>

    <!-- Clock / Crest in Center Gabled Pediment -->
    <circle cx="420" cy="52" r="16" fill="#F9D423" stroke="#064525" stroke-width="2"/>
    <line x1="420" y1="52" x2="420" y2="42" stroke="#064525" stroke-width="2"/>
    <line x1="420" y1="52" x2="427" y2="52" stroke="#064525" stroke-width="2"/>

    <!-- Left Wing -->
    <rect x="40" y="120" width="200" height="140" rx="3" fill="#F7FAF8" stroke="#105A34" stroke-width="2"/>
    <polygon points="35,120 140,70 245,120" fill="#105A34"/>

    <!-- Right Wing -->
    <rect x="600" y="120" width="200" height="140" rx="3" fill="#F7FAF8" stroke="#105A34" stroke-width="2"/>
    <polygon points="595,120 700,70 805,120" fill="#105A34"/>

    <!-- Pillared Veranda & Entrance -->
    <rect x="360" y="180" width="120" height="80" fill="#EAF5ED" stroke="#105A34" stroke-width="2"/>
    <path d="M 390,200 A 30,30 0 0,1 450,200 L 450,260 L 390,260 Z" fill="#105A34"/>
    
    <!-- Windows Matrix -->
    <g fill="#105A34" opacity="0.85">
      <!-- Left Wing Windows -->
      <rect x="65" y="140" width="28" height="42" rx="2"/><rect x="105" y="140" width="28" height="42" rx="2"/>
      <rect x="145" y="140" width="28" height="42" rx="2"/><rect x="185" y="140" width="28" height="42" rx="2"/>
      <rect x="65" y="200" width="28" height="42" rx="2"/><rect x="105" y="200" width="28" height="42" rx="2"/>
      <rect x="145" y="200" width="28" height="42" rx="2"/><rect x="185" y="200" width="28" height="42" rx="2"/>
      <!-- Center Wing Windows -->
      <rect x="250" y="110" width="30" height="45" rx="2"/><rect x="300" y="110" width="30" height="45" rx="2"/>
      <rect x="510" y="110" width="30" height="45" rx="2"/><rect x="560" y="110" width="30" height="45" rx="2"/>
      <!-- Right Wing Windows -->
      <rect x="625" y="140" width="28" height="42" rx="2"/><rect x="665" y="140" width="28" height="42" rx="2"/>
      <rect x="705" y="140" width="28" height="42" rx="2"/><rect x="745" y="140" width="28" height="42" rx="2"/>
      <rect x="625" y="200" width="28" height="42" rx="2"/><rect x="665" y="200" width="28" height="42" rx="2"/>
      <rect x="705" y="200" width="28" height="42" rx="2"/><rect x="745" y="200" width="28" height="42" rx="2"/>
    </g>

    <!-- School Signboard -->
    <rect x="220" y="85" width="400" height="24" rx="3" fill="#105A34"/>
    <text x="420" y="101" font-family="'Hind', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">CM SOE UPG GOVT+2 SCHOOL VNIKETAN HALDIPOKHAR</text>

    <!-- Flagpole & Tricolor -->
    <line x1="420" y1="10" x2="420" y2="-45" stroke="#FFFFFF" stroke-width="3"/>
    <g transform="translate(422, -45)">
      <rect x="0" y="0" width="45" height="8" fill="#FF9933"/>
      <rect x="0" y="8" width="45" height="8" fill="#FFFFFF"/>
      <rect x="0" y="16" width="45" height="8" fill="#138808"/>
      <circle cx="22.5" cy="12" r="3.5" fill="none" stroke="#000080" stroke-width="0.8"/>
    </g>
  </g>

  <!-- Front Garden & Walkway Lawn -->
  <path d="M 0,500 L 1200,500 L 1200,650 L 0,650 Z" fill="url(#lawnGrad)"/>
  <polygon points="600,500 680,650 520,650" fill="#DCE8DF" opacity="0.6"/>

  <!-- Flanking Trees -->
  <g fill="#16864A">
    <circle cx="100" cy="460" r="50"/>
    <circle cx="140" cy="480" r="45"/>
    <circle cx="70" cy="490" r="40"/>
    <rect x="95" y="500" width="12" height="60" fill="#5D4037"/>

    <circle cx="1100" cy="460" r="50"/>
    <circle cx="1060" cy="480" r="45"/>
    <circle cx="1130" cy="490" r="40"/>
    <rect x="1095" y="500" width="12" height="60" fill="#5D4037"/>
  </g>

  <!-- Modern Overlay Badge -->
  <rect x="60" y="50" width="420" height="95" rx="10" fill="#064525" opacity="0.9" stroke="#E1A100" stroke-width="1.5"/>
  <text x="80" y="78" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#F9D423" letter-spacing="1">CM SCHOOL OF EXCELLENCE (CM SOE)</text>
  <text x="80" y="104" font-family="'Hind', sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">+2 राजकीयकृत विद्या निकेतन उच्च विद्यालय</text>
  <text x="80" y="126" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#EAF5ED">CM SOE UPG GOVT+2 SCHOOL VNIKETAN HALDIPOKHAR</text>
</svg>