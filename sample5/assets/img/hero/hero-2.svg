<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064525"/>
      <stop offset="50%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#0b3820"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EAF5ED" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="650" fill="url(#labBg)"/>

  <!-- Tech Grid Background -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="650" fill="url(#grid)"/>
  </g>

  <!-- Smart Classroom Board -->
  <rect x="250" y="80" width="700" height="380" rx="12" fill="#042816" stroke="#16864A" stroke-width="4"/>
  <rect x="270" y="100" width="660" height="340" rx="8" fill="#083820"/>

  <!-- Molecular Structure & Formulae on Screen -->
  <g stroke="#F9D423" stroke-width="2" fill="none" opacity="0.75">
    <polygon points="400,200 450,170 500,200 500,260 450,290 400,260"/>
    <line x1="500" y1="200" x2="550" y2="170"/>
    <circle cx="400" cy="200" r="7" fill="#F9D423"/>
    <circle cx="450" cy="170" r="7" fill="#16864A"/>
    <circle cx="500" cy="200" r="7" fill="#F9D423"/>
    <circle cx="500" cy="260" r="7" fill="#16864A"/>
    <circle cx="450" cy="290" r="7" fill="#F9D423"/>
    <circle cx="400" cy="260" r="7" fill="#16864A"/>
    <circle cx="550" cy="170" r="7" fill="#F9D423"/>
  </g>
  <text x="680" y="190" font-family="'Poppins', sans-serif" font-size="28" font-weight="700" fill="#EAF5ED">STEM &amp; ICT LAB</text>
  <text x="680" y="230" font-family="'Hind', sans-serif" font-size="18" fill="#F9D423">प्रायोगिक शिक्षा एवं वैज्ञानिक दृष्टिकोण</text>
  <text x="680" y="270" font-family="'Poppins', sans-serif" font-size="14" fill="#DCE8DF">E = mc² • H₂O + CO₂ → C₆H₁₂O₆ + O₂</text>
  <text x="680" y="310" font-family="'Poppins', sans-serif" font-size="14" fill="#16864A" font-weight="600">Smart Classroom Interactive Module</text>

  <!-- Lab Workstation Table -->
  <rect x="100" y="460" width="1000" height="190" rx="8" fill="#031c0e" stroke="#105A34" stroke-width="2"/>
  
  <!-- Microscope -->
  <g transform="translate(260, 410)">
    <path d="M 40,80 L 10,80 L 20,50 L 35,50 Z" fill="#DCE8DF"/>
    <rect x="22" y="20" width="12" height="40" fill="#FFFFFF" rx="2"/>
    <circle cx="28" cy="20" r="8" fill="#F9D423"/>
    <path d="M 28,12 L 28,-20 L 50,-10 L 40,2 Z" fill="#105A34"/>
    <rect x="5" y="80" width="50" height="10" rx="3" fill="#16864A"/>
  </g>

  <!-- Beakers and Flasks -->
  <g transform="translate(420, 420)">
    <!-- Conical Flask -->
    <path d="M 30,0 L 40,0 L 40,25 L 65,70 C 68,75 64,80 58,80 L 12,80 C 6,80 2,75 5,70 L 30,25 Z" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M 12,80 L 58,80 C 64,80 66,76 63,72 L 50,48 L 20,48 L 7,72 C 4,76 6,80 12,80 Z" fill="#00E5FF" opacity="0.6"/>
    <!-- Test Tube Stand -->
    <rect x="100" y="30" width="80" height="50" fill="none" stroke="#DCE8DF" stroke-width="2"/>
    <rect x="110" y="10" width="12" height="65" rx="6" fill="#FF5252" opacity="0.75" stroke="#FFFFFF"/>
    <rect x="130" y="10" width="12" height="65" rx="6" fill="#F9D423" opacity="0.75" stroke="#FFFFFF"/>
    <rect x="150" y="10" width="12" height="65" rx="6" fill="#4CAF50" opacity="0.75" stroke="#FFFFFF"/>
  </g>

  <!-- Modern Overlay Badge -->
  <rect x="60" y="50" width="370" height="90" rx="10" fill="#064525" opacity="0.9" stroke="#E1A100" stroke-width="1.5"/>
  <text x="80" y="82" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="#F9D423" letter-spacing="1">MODERN INFRASTRUCTURE</text>
  <text x="80" y="112" font-family="'Hind', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">प्रयोगशाला एवं डिजिटल शिक्षा</text>
  <text x="80" y="130" font-family="'Poppins', sans-serif" font-size="11" font-weight="400" fill="#EAF5ED">Physics, Chemistry, Biology &amp; ICT Labs</text>
</svg>