<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <linearGradient id="sportsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a4624"/>
      <stop offset="60%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#199252"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="650" fill="url(#sportsGrad)"/>

  <!-- Energy dynamic wave lines -->
  <path d="M 0,450 C 300,300 600,600 1200,350 L 1200,650 L 0,650 Z" fill="#064525" opacity="0.5"/>
  <path d="M 0,520 C 400,420 800,620 1200,480 L 1200,650 L 0,650 Z" fill="#042e19" opacity="0.6"/>

  <!-- Running Track curves -->
  <g fill="none" stroke="#EAF5ED" stroke-width="2.5" opacity="0.3">
    <ellipse cx="600" cy="550" rx="550" ry="200"/>
    <ellipse cx="600" cy="550" rx="490" ry="175"/>
    <ellipse cx="600" cy="550" rx="430" ry="150"/>
  </g>

  <!-- Large Trophy in Center-Right -->
  <g transform="translate(750, 140)">
    <!-- Glow -->
    <circle cx="150" cy="180" r="140" fill="#F9D423" opacity="0.1"/>
    <!-- Trophy Cup -->
    <path d="M 80,60 L 220,60 C 220,160 180,210 150,230 C 120,210 80,160 80,60 Z" fill="#F9D423" stroke="#B78103" stroke-width="4"/>
    <!-- Handles -->
    <path d="M 80,90 C 20,90 20,160 90,170" fill="none" stroke="#F9D423" stroke-width="8" stroke-linecap="round"/>
    <path d="M 220,90 C 280,90 280,160 210,170" fill="none" stroke="#F9D423" stroke-width="8" stroke-linecap="round"/>
    <!-- Stem & Base -->
    <rect x="135" y="230" width="30" height="50" fill="#E1A100"/>
    <path d="M 110,280 L 190,280 L 205,320 L 95,320 Z" fill="#5D4037" stroke="#3E2723" stroke-width="3"/>
    <!-- Star on Trophy -->
    <polygon points="150,110 157,128 176,128 161,139 166,157 150,146 134,157 139,139 124,128 143,128" fill="#FFFFFF"/>
  </g>

  <!-- Football & Badges -->
  <g transform="translate(420, 200)">
    <!-- Football -->
    <circle cx="80" cy="180" r="45" fill="#FFFFFF" stroke="#064525" stroke-width="3"/>
    <polygon points="80,165 92,175 87,190 73,190 68,175" fill="#105A34"/>
    <line x1="80" y1="165" x2="80" y2="145" stroke="#064525" stroke-width="2"/>
    <line x1="92" y1="175" x2="110" y2="175" stroke="#064525" stroke-width="2"/>
    <line x1="87" y1="190" x2="100" y2="205" stroke="#064525" stroke-width="2"/>
    <line x1="73" y1="190" x2="60" y2="205" stroke="#064525" stroke-width="2"/>
    <line x1="68" y1="175" x2="50" y2="175" stroke="#064525" stroke-width="2"/>
  </g>

  <!-- Modern Overlay Badge -->
  <rect x="60" y="50" width="380" height="90" rx="10" fill="#064525" opacity="0.9" stroke="#E1A100" stroke-width="1.5"/>
  <text x="80" y="82" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="#F9D423" letter-spacing="1">HOLISTIC DEVELOPMENT</text>
  <text x="80" y="112" font-family="'Hind', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">खेलकूद, सांस्कृतिक व स्काउट-गाइड</text>
  <text x="80" y="130" font-family="'Poppins', sans-serif" font-size="11" font-weight="400" fill="#EAF5ED">Sports, Scouts &amp; Guides, Cultural Arts &amp; Exhibitions</text>
</svg>