<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#064525"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D423"/>
      <stop offset="100%" stop-color="#E1A100"/>
    </linearGradient>
    <path id="textCircleTop" d="M 75,250 A 175,175 0 0,1 425,250" fill="none" />
    <path id="textCircleBottom" d="M 425,250 A 175,175 0 0,1 75,250" fill="none" />
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="235" fill="#FFFFFF" stroke="#105A34" stroke-width="8"/>
  <circle cx="250" cy="250" r="222" fill="#EAF5ED" stroke="#16864A" stroke-width="3" stroke-dasharray="6,4"/>
  <circle cx="250" cy="250" r="160" fill="url(#shieldGrad)" stroke="#E1A100" stroke-width="6"/>

  <!-- Sun Rays in Center -->
  <g opacity="0.25">
    <circle cx="250" cy="205" r="70" fill="none" stroke="#F9D423" stroke-width="2" stroke-dasharray="4,8"/>
    <line x1="250" y1="130" x2="250" y2="150" stroke="#F9D423" stroke-width="4"/>
    <line x1="250" y1="260" x2="250" y2="280" stroke="#F9D423" stroke-width="4"/>
    <line x1="175" y1="205" x2="195" y2="205" stroke="#F9D423" stroke-width="4"/>
    <line x1="305" y1="205" x2="325" y2="205" stroke="#F9D423" stroke-width="4"/>
    <line x1="197" y1="152" x2="211" y2="166" stroke="#F9D423" stroke-width="4"/>
    <line x1="289" y1="244" x2="303" y2="258" stroke="#F9D423" stroke-width="4"/>
    <line x1="197" y1="258" x2="211" y2="244" stroke="#F9D423" stroke-width="4"/>
    <line x1="289" y1="166" x2="303" y2="152" stroke="#F9D423" stroke-width="4"/>
  </g>

  <!-- Laurel Leaves (Left & Right) -->
  <g fill="#16864A" opacity="0.85">
    <!-- Left Wreath -->
    <path d="M 120,230 C 115,210 130,205 135,220 C 130,235 125,240 120,230 Z"/>
    <path d="M 112,205 C 105,185 120,180 125,195 C 122,210 116,215 112,205 Z"/>
    <path d="M 115,178 C 110,160 125,155 130,170 C 126,182 120,188 115,178 Z"/>
    <!-- Right Wreath -->
    <path d="M 380,230 C 385,210 370,205 365,220 C 370,235 375,240 380,230 Z"/>
    <path d="M 388,205 C 395,185 380,180 375,195 C 378,210 384,215 388,205 Z"/>
    <path d="M 385,178 C 390,160 375,155 370,170 C 374,182 380,188 385,178 Z"/>
  </g>

  <!-- Open Book of Wisdom -->
  <g id="openBook">
    <path d="M 250,225 C 220,210 185,212 170,225 L 170,265 C 185,250 220,250 250,265 C 280,250 315,250 330,265 L 330,225 C 315,212 280,210 250,225 Z" fill="#FFFFFF" stroke="#E1A100" stroke-width="3"/>
    <path d="M 250,225 L 250,265" stroke="#105A34" stroke-width="3"/>
    <!-- Book lines -->
    <line x1="185" y1="230" x2="235" y2="232" stroke="#16864A" stroke-width="2" stroke-linecap="round"/>
    <line x1="185" y1="240" x2="235" y2="242" stroke="#16864A" stroke-width="2" stroke-linecap="round"/>
    <line x1="185" y1="250" x2="230" y2="252" stroke="#16864A" stroke-width="2" stroke-linecap="round"/>
    <line x1="265" y1="232" x2="315" y2="230" stroke="#16864A" stroke-width="2" stroke-linecap="round"/>
    <line x1="265" y1="242" x2="315" y2="240" stroke="#16864A" stroke-width="2" stroke-linecap="round"/>
    <line x1="270" y1="252" x2="315" y2="250" stroke="#16864A" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Flame of Knowledge / Diya -->
  <g id="lamp">
    <ellipse cx="250" cy="188" rx="22" ry="7" fill="url(#goldGrad)"/>
    <path d="M 250,150 C 238,170 242,185 250,185 C 258,185 262,170 250,150 Z" fill="#FF5722"/>
    <path d="M 250,158 C 244,170 246,182 250,182 C 254,182 256,170 250,158 Z" fill="#FFC107"/>
  </g>

  <!-- Motto Banner -->
  <path d="M 180,285 Q 250,275 320,285 L 315,302 Q 250,292 185,302 Z" fill="#F9D423" stroke="#B78103" stroke-width="1.5"/>
  <text x="250" y="296" font-family="'Hind', sans-serif" font-size="12" font-weight="700" fill="#064525" text-anchor="middle">सा विद्या या विमुक्तये</text>

  <!-- Top Circular Text (Hindi Name) -->
  <text font-family="'Hind', 'Noto Sans Devanagari', sans-serif" font-size="19" font-weight="700" fill="#064525" letter-spacing="1.5">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      +2 राजकीयकृत विद्या निकेतन उच्च विद्यालय
    </textPath>
  </text>

  <!-- Bottom Circular Text (CM SOE English Name & U-DISE) -->
  <text font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#105A34" letter-spacing="0.5">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      CM SOE UPG GOVT+2 SCHOOL VNIKETAN HALDIPOKHAR • U-DISE: 20180231602
    </textPath>
  </text>

  <!-- Star accents -->
  <polygon points="68,245 72,255 60,250 74,250 64,258" fill="#E1A100"/>
  <polygon points="432,245 436,255 424,250 438,250 428,258" fill="#E1A100"/>
</svg>