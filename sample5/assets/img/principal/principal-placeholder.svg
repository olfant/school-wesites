<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF5ED"/>
      <stop offset="100%" stop-color="#DCE8DF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D423"/>
      <stop offset="100%" stop-color="#B78103"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="480" rx="16" fill="url(#bgGrad)" stroke="#105A34" stroke-width="3"/>
  <rect x="15" y="15" width="370" height="450" rx="12" fill="none" stroke="#DCE8DF" stroke-width="2" stroke-dasharray="8,6"/>

  <!-- Silhouette Profile of Dignified Educator -->
  <g fill="#105A34" opacity="0.85">
    <!-- Academic Cap / Mortarboard -->
    <polygon points="200,90 270,115 200,140 130,115" fill="#064525"/>
    <rect x="160" y="130" width="80" height="25" rx="5" fill="#105A34"/>
    <path d="M 270,115 L 285,155 L 280,185" fill="none" stroke="#F9D423" stroke-width="3"/>
    <circle cx="280" cy="188" r="5" fill="#F9D423"/>

    <!-- Head & Neck -->
    <circle cx="200" cy="180" r="42"/>
    <rect x="185" y="215" width="30" height="45"/>

    <!-- Shoulders & Suit / Formal Attire -->
    <path d="M 100,320 C 100,260 140,245 180,245 L 220,245 C 260,245 300,260 300,320 L 300,350 L 100,350 Z"/>
    <polygon points="200,248 180,285 200,330 220,285" fill="#FFFFFF"/>
    <polygon points="195,285 205,285 202,320 198,320" fill="#16864A"/>
  </g>

  <!-- Laurel Wreath at Bottom of Portrait -->
  <g fill="#16864A" opacity="0.6" transform="translate(140, 310)">
    <circle cx="20" cy="20" r="6"/>
    <circle cx="40" cy="25" r="7"/>
    <circle cx="60" cy="25" r="7"/>
    <circle cx="80" cy="20" r="6"/>
    <circle cx="100" cy="15" r="5"/>
  </g>

  <!-- Official Placeholder Tag -->
  <g transform="translate(40, 375)">
    <rect width="320" height="65" rx="8" fill="#105A34" stroke="#F9D423" stroke-width="1.5"/>
    <text x="160" y="26" font-family="'Hind', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">प्राचार्य कक्ष (Principal's Desk)</text>
    <text x="160" y="48" font-family="'Poppins', sans-serif" font-size="12" font-weight="500" fill="#F9D423" text-anchor="middle">[ Official Photo Placeholder ]</text>
  </g>
</svg>