<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEv1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E36" />
      <stop offset="100%" stop-color="#087F50" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgEv1)" />
  <circle cx="700" cy="100" r="200" fill="#A3D977" opacity="0.1" />

  <!-- Trophy & Sports Medals Symbol -->
  <g transform="translate(320, 100)">
    <!-- Golden Trophy Cup -->
    <path d="M 30 20 L 130 20 L 120 100 C 110 130, 90 145, 80 150 C 70 145, 50 130, 40 100 Z" fill="#FFE082" stroke="#E09F3E" stroke-width="4" />
    <!-- Trophy Handles -->
    <path d="M 30 35 C 0 35, 0 85, 42 90" fill="none" stroke="#FFE082" stroke-width="6" stroke-linecap="round" />
    <path d="M 130 35 C 160 35, 160 85, 118 90" fill="none" stroke="#FFE082" stroke-width="6" stroke-linecap="round" />
    <!-- Stem and Base -->
    <rect x="72" y="150" width="16" height="35" fill="#E09F3E" />
    <rect x="45" y="185" width="70" height="25" rx="6" fill="#17251D" stroke="#FFE082" stroke-width="3" />
    <!-- Star on Trophy -->
    <polygon points="80,50 86,65 102,65 89,75 94,90 80,80 66,90 71,75 58,65 74,65" fill="#E09F3E" />
  </g>

  <!-- Athletic Figures Silhouette -->
  <g transform="translate(140, 240)" fill="#A3D977" opacity="0.9">
    <circle cx="30" cy="20" r="14" />
    <path d="M 20 40 L 40 40 L 50 75 L 30 75 Z" />
    <path d="M 15 75 L 25 120 M 45 75 L 60 115" stroke="#A3D977" stroke-width="8" stroke-linecap="round" />
  </g>

  <g transform="translate(600, 240)" fill="#FFFFFF" opacity="0.9">
    <circle cx="30" cy="20" r="14" />
    <path d="M 20 40 L 40 40 L 50 75 L 30 75 Z" />
    <path d="M 15 75 L 5 115 M 45 75 L 35 120" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
  </g>

  <rect x="200" y="420" width="400" height="42" rx="21" fill="#064E36" stroke="#A3D977" stroke-width="2" />
  <text x="400" y="447" font-family="'Outfit', sans-serif" font-size="15.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    ANNUAL ATHLETIC &amp; SPORTS MEET
  </text>
</svg>
