<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEv4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E36" />
      <stop offset="60%" stop-color="#075B3B" />
      <stop offset="100%" stop-color="#087F50" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgEv4)" />
  <circle cx="680" cy="110" r="220" fill="#A3D977" opacity="0.08" />

  <!-- Academic Honors Medal & Certificate Scroll -->
  <g transform="translate(330, 80)">
    <!-- Certificate Scroll -->
    <rect x="0" y="20" width="140" height="190" rx="6" fill="#FFFFFF" stroke="#087F50" stroke-width="4" />
    <rect x="15" y="45" width="110" height="8" rx="2" fill="#087F50" />
    <line x1="20" y1="75" x2="120" y2="75" stroke="#A3D977" stroke-width="3" />
    <line x1="20" y1="95" x2="120" y2="95" stroke="#E1EAE3" stroke-width="3" />
    <line x1="20" y1="115" x2="120" y2="115" stroke="#E1EAE3" stroke-width="3" />
    <line x1="20" y1="135" x2="90" y2="135" stroke="#E1EAE3" stroke-width="3" />
    <!-- Red Wax Seal with Ribbon -->
    <circle cx="70" cy="175" r="20" fill="#D9383A" stroke="#FFFFFF" stroke-width="2" />
    <polygon points="62,190 70,225 78,190" fill="#D9383A" />
    <polygon points="70,190 78,225 86,190" fill="#B71C1C" />
  </g>

  <!-- Big Gold Distinction Medal (Left) -->
  <g transform="translate(180, 160)">
    <!-- V-Ribbon -->
    <polygon points="40,0 70,80 100,0 80,0 70,50 60,0" fill="#087F50" />
    <polygon points="40,0 70,80 100,0 80,0 70,50 60,0" fill="none" stroke="#A3D977" stroke-width="2" />
    <!-- Gold Medal -->
    <circle cx="70" cy="110" r="35" fill="#FFE082" stroke="#E09F3E" stroke-width="4" />
    <circle cx="70" cy="110" r="28" fill="none" stroke="#E09F3E" stroke-width="2" stroke-dasharray="3 3" />
    <text x="70" y="117" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#B78103" text-anchor="middle">1st</text>
  </g>

  <!-- Laurel Leaves (Right) -->
  <g transform="translate(540, 170)" fill="#A3D977">
    <ellipse cx="40" cy="40" rx="14" ry="24" transform="rotate(30, 40, 40)" />
    <ellipse cx="60" cy="70" rx="14" ry="24" transform="rotate(45, 60, 70)" />
    <ellipse cx="75" cy="110" rx="14" ry="24" transform="rotate(60, 75, 110)" />
  </g>

  <rect x="180" y="420" width="440" height="42" rx="21" fill="#064E36" stroke="#A3D977" stroke-width="2" />
  <text x="400" y="447" font-family="'Outfit', sans-serif" font-size="15.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    ANNUAL MERIT &amp; ACADEMIC EXCELLENCE AWARDS
  </text>
</svg>
