<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E36" />
      <stop offset="60%" stop-color="#075B3B" />
      <stop offset="100%" stop-color="#087F50" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradBio)" />
  <circle cx="680" cy="110" r="220" fill="#A3D977" opacity="0.08" />

  <!-- High-Precision Compound Microscope (Center) -->
  <g transform="translate(330, 90)">
    <!-- Eyepiece Tube -->
    <rect x="75" y="10" width="16" height="60" rx="3" fill="#FFFFFF" stroke="#064E36" stroke-width="2" transform="rotate(-25, 75, 10)" />
    <!-- Revolving Nosepiece & Objectives -->
    <circle cx="50" cy="110" r="20" fill="#17251D" stroke="#A3D977" stroke-width="2" />
    <rect x="42" y="130" width="8" height="25" fill="#A3D977" />
    <rect x="54" y="128" width="6" height="20" fill="#FFFFFF" />
    <!-- Stage Platform -->
    <rect x="10" y="160" width="100" height="12" rx="3" fill="#17251D" stroke="#A3D977" stroke-width="2" />
    <rect x="45" y="157" width="30" height="4" fill="#FFFFFF" />
    <!-- Curved Arm & Base -->
    <path d="M 80 80 C 120 100, 130 180, 90 220 L 90 250" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    <!-- Base -->
    <rect x="20" y="245" width="110" height="22" rx="8" fill="#17251D" stroke="#A3D977" stroke-width="3" />
    <!-- Light Source / Mirror -->
    <circle cx="70" cy="210" r="14" fill="#FFFFFF" stroke="#A3D977" stroke-width="2" />
  </g>

  <!-- DNA Double Helix Illustration (Left) -->
  <g transform="translate(100, 110)">
    <path d="M 40 20 Q 80 80, 40 140 T 40 260" fill="none" stroke="#A3D977" stroke-width="4" stroke-linecap="round" />
    <path d="M 80 20 Q 40 80, 80 140 T 80 260" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <!-- Base Pairs (Rungs) -->
    <line x1="45" y1="50" x2="75" y2="50" stroke="#E09F3E" stroke-width="3" />
    <line x1="60" y1="80" x2="60" y2="80" stroke="#FFFFFF" stroke-width="3" />
    <line x1="45" y1="110" x2="75" y2="110" stroke="#087F50" stroke-width="3" />
    <line x1="45" y1="170" x2="75" y2="170" stroke="#E09F3E" stroke-width="3" />
    <line x1="45" y1="230" x2="75" y2="230" stroke="#A3D977" stroke-width="3" />
  </g>

  <!-- Botanical Specimen Leaf / Petri Dish (Right) -->
  <g transform="translate(560, 130)">
    <circle cx="80" cy="110" r="65" fill="rgba(255,255,255,0.12)" stroke="#FFFFFF" stroke-width="3" />
    <!-- Plant Leaf inside -->
    <path d="M 50 140 C 40 90, 80 60, 110 75 C 120 110, 95 140, 50 140 Z" fill="#A3D977" />
    <path d="M 50 140 Q 85 105, 110 75" stroke="#064E36" stroke-width="2.5" fill="none" />
  </g>

  <!-- Lab Work Surface -->
  <rect x="50" y="380" width="700" height="20" rx="5" fill="#075B3B" stroke="#A3D977" stroke-width="2" />

  <!-- Facility Title Banner -->
  <rect x="230" y="425" width="340" height="42" rx="21" fill="#064E36" stroke="#A3D977" stroke-width="2" />
  <text x="400" y="452" font-family="'Outfit', sans-serif" font-size="15.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    ADVANCED BIOLOGY LABORATORY
  </text>
</svg>
