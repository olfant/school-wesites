<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradChem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E36" />
      <stop offset="60%" stop-color="#075B3B" />
      <stop offset="100%" stop-color="#087F50" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradChem)" />
  <circle cx="680" cy="100" r="220" fill="#A3D977" opacity="0.08" />

  <!-- Chemical Flasks & Beakers -->
  <g transform="translate(240, 150)">
    <!-- Conical Flask (Erlenmeyer) -->
    <path d="M 50 40 L 70 40 L 70 80 L 115 170 C 120 180, 115 190, 100 190 L 20 190 C 5 190, 0 180, 5 170 L 50 80 Z" fill="rgba(255,255,255,0.15)" stroke="#A3D977" stroke-width="3.5" />
    <!-- Liquid in Flask -->
    <path d="M 22 170 L 98 170 C 103 178, 100 185, 90 185 L 30 185 C 20 185, 17 178, 22 170 Z" fill="#A3D977" opacity="0.8" />
    <!-- Bubbles -->
    <circle cx="55" cy="140" r="5" fill="#FFFFFF" opacity="0.8" />
    <circle cx="68" cy="120" r="3.5" fill="#FFFFFF" opacity="0.8" />
    <circle cx="50" cy="105" r="4" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Round Bottom Flask with Condenser (Right) -->
  <g transform="translate(450, 130)">
    <circle cx="80" cy="130" r="60" fill="rgba(255,255,255,0.15)" stroke="#FFFFFF" stroke-width="3" />
    <rect x="70" y="20" width="20" height="60" fill="rgba(255,255,255,0.15)" stroke="#FFFFFF" stroke-width="3" />
    <!-- Chemical Liquid -->
    <path d="M 30 145 Q 80 170, 130 145 A 60 60 0 0 1 30 145 Z" fill="#087F50" />
    <!-- Bunsen Burner Below -->
    <rect x="65" y="200" width="30" height="40" fill="#17251D" />
    <rect x="50" y="240" width="60" height="8" rx="4" fill="#A3D977" />
    <!-- Blue / Orange Flame -->
    <path d="M 80 185 C 88 192, 85 198, 80 200 C 75 198, 72 192, 80 185 Z" fill="#40C4FF" />
  </g>

  <!-- Molecular Structure (Floating Left) -->
  <g transform="translate(80, 100)" stroke="#A3D977" stroke-width="2">
    <circle cx="40" cy="40" r="14" fill="#087F50" stroke="#FFFFFF" stroke-width="2" />
    <text x="40" y="45" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">H</text>
    <line x1="50" y1="50" x2="90" y2="90" />
    <circle cx="100" cy="100" r="18" fill="#064E36" stroke="#A3D977" stroke-width="2.5" />
    <text x="100" y="106" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">O</text>
    <line x1="110" y1="90" x2="150" y2="50" />
    <circle cx="160" cy="40" r="14" fill="#087F50" stroke="#FFFFFF" stroke-width="2" />
    <text x="160" y="45" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">H</text>
  </g>

  <!-- Lab Work Surface -->
  <rect x="50" y="380" width="700" height="20" rx="5" fill="#075B3B" stroke="#A3D977" stroke-width="2" />

  <!-- Facility Title Banner -->
  <rect x="220" y="425" width="360" height="42" rx="21" fill="#064E36" stroke="#A3D977" stroke-width="2" />
  <text x="400" y="452" font-family="'Outfit', sans-serif" font-size="15.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    MODERN CHEMISTRY LABORATORY
  </text>
</svg>
