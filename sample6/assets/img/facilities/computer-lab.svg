    <rect x="12" y="12" width="176" height="116" rx="6" fill="#064E36" />
    <circle cx="100" cy="55" r="22" fill="#087F50" stroke="#A3D977" stroke-width="2" />
    <path d="M 92 55 L 108 55 M 100 47 L 100 63" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <text x="100" y="102" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">PYTHON &amp; ICT LAB</text>
    <rect x="85" y="140" width="30" height="35" fill="#064E36" />
