      <stop offset="0%" stop-color="#064E36" />
      <stop offset="60%" stop-color="#075B3B" />
      <stop offset="100%" stop-color="#087F50" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradComp)" />
  <circle cx="720" cy="100" r="240" fill="#A3D977" opacity="0.08" />

  <!-- Code / Terminal Matrix Background -->
