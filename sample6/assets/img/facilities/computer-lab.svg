    <text x="40" y="50">&lt;html&gt;&lt;body&gt; function initSOELab() { return true; } &lt;/body&gt;&lt;/html&gt;</text>
    <text x="40" y="80">import numpy as np; import pandas as pd; print('CM SOE LAB')</text>
    <text x="40" y="110">git commit -m "Excellence in Digital Learning" --soevniketan</text>
  </g>

  <!-- Computer Workstation 1 (Left) -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="160" height="110" rx="8" fill="#17251D" stroke="#A3D977" stroke-width="3" />
    <rect x="10" y="10" width="140" height="90" rx="4" fill="#0A3C2B" />
    <text x="80" y="58" font-family="monospace" font-size="14" font-weight="700" fill="#A3D977" text-anchor="middle">&lt;CODE/&gt;</text>
    <rect x="70" y="110" width="20" height="30" fill="#064E36" />
    <rect x="50" y="140" width="60" height="8" rx="4" fill="#A3D977" />
    <rect x="10" y="155" width="140" height="12" rx="3" fill="#064E36" />
  </g>

  <!-- Computer Workstation 2 (Center - Prominent) -->
  <g transform="translate(300, 120)">
