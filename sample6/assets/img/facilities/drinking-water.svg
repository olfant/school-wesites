<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E36" />
      <stop offset="60%" stop-color="#075B3B" />
      <stop offset="100%" stop-color="#087F50" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradWater)" />
  <circle cx="680" cy="110" r="220" fill="#A3D977" opacity="0.08" />

  <!-- Central Water Purification Station & Fountains -->
  <g transform="translate(250, 100)">
    <!-- Stainless Steel Dispenser Housing -->
    <rect x="0" y="20" width="300" height="240" rx="14" fill="#F0F6F2" stroke="#A3D977" stroke-width="4" />
    <rect x="20" y="40" width="260" height="40" rx="8" fill="#087F50" />
    <text x="150" y="66" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">RO PURIFIED SAFE DRINKING WATER</text>

    <!-- 3 Taps -->
    <!-- Tap 1 -->
    <path d="M 60 110 L 60 140 L 50 140" fill="none" stroke="#064E36" stroke-width="6" stroke-linecap="round" />
    <circle cx="60" cy="105" r="8" fill="#087F50" />
    <path d="M 50 155 C 50 170, 42 180, 50 190 C 58 180, 50 170, 50 155 Z" fill="#40C4FF" />

    <!-- Tap 2 (Center) -->
    <path d="M 150 110 L 150 140 L 140 140" fill="none" stroke="#064E36" stroke-width="6" stroke-linecap="round" />
    <circle cx="150" cy="105" r="8" fill="#087F50" />
    <path d="M 140 155 C 140 170, 132 180, 140 190 C 148 180, 140 170, 140 155 Z" fill="#40C4FF" />

    <!-- Tap 3 -->
    <path d="M 240 110 L 240 140 L 230 140" fill="none" stroke="#064E36" stroke-width="6" stroke-linecap="round" />
    <circle cx="240" cy="105" r="8" fill="#087F50" />
    <path d="M 230 155 C 230 170, 222 180, 230 190 C 238 180, 230 170, 230 155 Z" fill="#40C4FF" />

    <!-- Drain Basin -->
    <rect x="25" y="210" width="250" height="30" rx="6" fill="#D3EBD9" stroke="#087F50" stroke-width="2" />
  </g>

  <!-- Ground Stand -->
  <rect x="200" y="360" width="400" height="20" rx="4" fill="#064E36" stroke="#A3D977" stroke-width="2" />

  <!-- Facility Title Banner -->
  <rect x="210" y="425" width="380" height="42" rx="21" fill="#064E36" stroke="#A3D977" stroke-width="2" />
  <text x="400" y="452" font-family="'Outfit', sans-serif" font-size="15.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    RO SAFE DRINKING WATER STATIONS
  </text>
</svg>
