<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradLib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E36" />
      <stop offset="60%" stop-color="#075B3B" />
      <stop offset="100%" stop-color="#087F50" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradLib)" />
  <circle cx="700" cy="90" r="220" fill="#A3D977" opacity="0.08" />

  <!-- Library Bookshelves in Background -->
  <g transform="translate(140, 80)">
    <!-- Bookcase Frame -->
    <rect x="0" y="0" width="520" height="240" rx="8" fill="#0A3C2B" stroke="#A3D977" stroke-width="3" />
    <!-- Shelf Dividers -->
    <line x1="0" y1="80" x2="520" y2="80" stroke="#A3D977" stroke-width="3" />
    <line x1="0" y1="160" x2="520" y2="160" stroke="#A3D977" stroke-width="3" />
    
    <!-- Top Shelf Books -->
    <g fill="#A3D977">
      <rect x="20" y="20" width="22" height="60" rx="2" fill="#E09F3E" />
      <rect x="46" y="15" width="26" height="65" rx="2" fill="#087F50" />
      <rect x="76" y="25" width="20" height="55" rx="2" fill="#FFFFFF" />
      <rect x="100" y="18" width="28" height="62" rx="2" fill="#A3D977" />
      <rect x="132" y="15" width="24" height="65" rx="2" fill="#D9383A" />
      <rect x="160" y="22" width="22" height="58" rx="2" fill="#087F50" />
      <rect x="186" y="15" width="30" height="65" rx="2" fill="#A3D977" />

      <rect x="320" y="18" width="26" height="62" rx="2" fill="#FFFFFF" />
      <rect x="350" y="15" width="22" height="65" rx="2" fill="#E09F3E" />
      <rect x="376" y="22" width="28" height="58" rx="2" fill="#A3D977" />
      <rect x="408" y="15" width="24" height="65" rx="2" fill="#087F50" />
      <rect x="436" y="25" width="20" height="55" rx="2" fill="#D9383A" />
      <rect x="460" y="15" width="35" height="65" rx="2" fill="#A3D977" />
    </g>

    <!-- Middle Shelf Books -->
    <g fill="#087F50">
      <rect x="25" y="95" width="30" height="65" rx="2" fill="#A3D977" />
      <rect x="60" y="100" width="25" height="60" rx="2" fill="#FFFFFF" />
      <rect x="90" y="95" width="28" height="65" rx="2" fill="#087F50" />
      <rect x="122" y="105" width="22" height="55" rx="2" fill="#E09F3E" />
      <rect x="148" y="95" width="32" height="65" rx="2" fill="#A3D977" />

      <rect x="310" y="95" width="35" height="65" rx="2" fill="#087F50" />
      <rect x="350" y="100" width="24" height="60" rx="2" fill="#FFFFFF" />
      <rect x="378" y="95" width="30" height="65" rx="2" fill="#A3D977" />
      <rect x="412" y="105" width="20" height="55" rx="2" fill="#D9383A" />
      <rect x="436" y="95" width="40" height="65" rx="2" fill="#E09F3E" />
    </g>

    <!-- Bottom Shelf Books -->
    <g fill="#A3D977">
      <rect x="30" y="175" width="28" height="65" rx="2" fill="#FFFFFF" />
      <rect x="62" y="175" width="32" height="65" rx="2" fill="#A3D977" />
      <rect x="98" y="180" width="24" height="60" rx="2" fill="#087F50" />
      <rect x="126" y="175" width="35" height="65" rx="2" fill="#E09F3E" />

      <rect x="330" y="175" width="30" height="65" rx="2" fill="#A3D977" />
      <rect x="365" y="175" width="26" height="65" rx="2" fill="#087F50" />
      <rect x="395" y="180" width="28" height="60" rx="2" fill="#FFFFFF" />
      <rect x="428" y="175" width="35" height="65" rx="2" fill="#D9383A" />
    </g>
  </g>

  <!-- Reading Desk & Open Manuscript in Foreground -->
  <g transform="translate(260, 310)">
    <!-- Desk Lamp -->
    <path d="M 60 50 Q 80 10, 110 30" fill="none" stroke="#A3D977" stroke-width="3" />
    <polygon points="105,25 125,25 130,45 100,45" fill="#E09F3E" />
    <!-- Open Book -->
    <path d="M 140 45 C 170 30, 200 32, 220 40 L 220 70 C 200 62, 170 60, 140 75 Z" fill="#FFFFFF" stroke="#064E36" stroke-width="1.5" />
    <path d="M 220 40 C 240 32, 270 30, 300 45 L 300 75 C 270 60, 240 62, 220 70 Z" fill="#FFFFFF" stroke="#064E36" stroke-width="1.5" />
  </g>

  <!-- Reading Table Surface -->
  <rect x="50" y="380" width="700" height="20" rx="5" fill="#075B3B" stroke="#A3D977" stroke-width="2" />

  <!-- Facility Title Banner -->
  <rect x="230" y="425" width="340" height="42" rx="21" fill="#064E36" stroke="#A3D977" stroke-width="2" />
  <text x="400" y="452" font-family="'Outfit', sans-serif" font-size="15.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    CENTRAL SCHOOL LIBRARY
  </text>
</svg>
