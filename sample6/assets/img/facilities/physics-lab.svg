<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPhy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E36" />
      <stop offset="60%" stop-color="#075B3B" />
      <stop offset="100%" stop-color="#087F50" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradPhy)" />
  <circle cx="680" cy="120" r="200" fill="#A3D977" opacity="0.08" />

  <!-- Atomic Orbit Symbols -->
  <g transform="translate(400, 200)" stroke="#A3D977" stroke-width="2.5" fill="none" opacity="0.85">
    <circle cx="0" cy="0" r="20" fill="#A3D977" />
    <ellipse cx="0" cy="0" rx="140" ry="50" transform="rotate(30)" />
    <ellipse cx="0" cy="0" rx="140" ry="50" transform="rotate(-30)" />
    <ellipse cx="0" cy="0" rx="140" ry="50" transform="rotate(90)" />
    <!-- Electrons -->
    <circle cx="100" cy="50" r="6" fill="#FFFFFF" stroke="#087F50" stroke-width="2" />
    <circle cx="-110" cy="-40" r="6" fill="#FFFFFF" stroke="#087F50" stroke-width="2" />
    <circle cx="0" cy="130" r="6" fill="#FFFFFF" stroke="#087F50" stroke-width="2" />
  </g>

  <!-- Optical Prism with Light Spectrum on Left -->
  <g transform="translate(130, 260)">
    <polygon points="60,20 120,120 0,120" fill="rgba(255,255,255,0.2)" stroke="#FFFFFF" stroke-width="3" />
    <!-- Incoming Ray -->
    <line x1="-50" y1="90" x2="40" y2="70" stroke="#FFFFFF" stroke-width="3" />
    <!-- Dispersed Rays -->
    <line x1="90" y1="75" x2="170" y2="40" stroke="#FF5252" stroke-width="2" />
    <line x1="90" y1="75" x2="170" y2="60" stroke="#FFD740" stroke-width="2" />
    <line x1="90" y1="75" x2="170" y2="80" stroke="#A3D977" stroke-width="2" />
    <line x1="90" y1="75" x2="170" y2="100" stroke="#40C4FF" stroke-width="2" />
  </g>

  <!-- Galvanometer / Circuit Instrument on Right -->
  <g transform="translate(600, 260)">
    <rect x="0" y="20" width="120" height="90" rx="10" fill="#0E2E22" stroke="#A3D977" stroke-width="3" />
    <circle cx="60" cy="60" r="30" fill="#FFFFFF" stroke="#075B3B" stroke-width="2" />
    <line x1="60" y1="75" x2="45" y2="50" stroke="#D9383A" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="60" cy="75" r="4" fill="#000000" />
    <text x="60" y="100" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#A3D977" text-anchor="middle">VOLTMETER</text>
  </g>

  <!-- Laboratory Table Surface -->
  <rect x="50" y="380" width="700" height="20" rx="5" fill="#075B3B" stroke="#A3D977" stroke-width="2" />

  <!-- Facility Title Banner -->
  <rect x="230" y="425" width="340" height="42" rx="21" fill="#064E36" stroke="#A3D977" stroke-width="2" />
  <text x="400" y="452" font-family="'Outfit', sans-serif" font-size="15.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    ADVANCED PHYSICS LABORATORY
  </text>
</svg>
