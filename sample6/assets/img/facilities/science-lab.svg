<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSci" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E36" />
      <stop offset="60%" stop-color="#075B3B" />
      <stop offset="100%" stop-color="#087F50" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGradSci)" />
  <circle cx="680" cy="110" r="220" fill="#A3D977" opacity="0.08" />

  <!-- Integrated Composite Science Lab (Physics, Chemistry, Biology) -->
  <g transform="translate(180, 120)">
    <!-- Flask -->
    <path d="M 40 40 L 55 40 L 55 70 L 90 140 C 95 150, 90 160, 80 160 L 15 160 C 5 160, 0 150, 5 140 L 40 70 Z" fill="rgba(255,255,255,0.15)" stroke="#A3D977" stroke-width="3" />
    <path d="M 16 145 L 78 145 C 82 152, 80 157, 72 157 L 24 157 C 16 157, 14 152, 16 145 Z" fill="#A3D977" />
  </g>

  <!-- Microscope (Center) -->
  <g transform="translate(360, 100)">
    <rect x="50" y="20" width="14" height="50" rx="3" fill="#FFFFFF" transform="rotate(-20, 50, 20)" />
    <circle cx="35" cy="90" r="15" fill="#17251D" stroke="#A3D977" stroke-width="2" />
    <rect x="0" y="130" width="75" height="10" rx="2" fill="#17251D" />
    <path d="M 50 60 C 80 80, 90 150, 60 180 L 60 200" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />
    <rect x="15" y="195" width="80" height="18" rx="6" fill="#17251D" stroke="#A3D977" stroke-width="2" />
  </g>

  <!-- Atomic Ring (Right) -->
  <g transform="translate(560, 170)" stroke="#A3D977" stroke-width="2.5" fill="none">
    <circle cx="40" cy="40" r="16" fill="#A3D977" />
    <ellipse cx="40" cy="40" rx="60" ry="25" transform="rotate(35, 40, 40)" />
    <ellipse cx="40" cy="40" rx="60" ry="25" transform="rotate(-35, 40, 40)" />
  </g>

  <!-- Lab Work Surface -->
  <rect x="50" y="380" width="700" height="20" rx="5" fill="#075B3B" stroke="#A3D977" stroke-width="2" />

  <!-- Facility Title Banner -->
  <rect x="230" y="425" width="340" height="42" rx="21" fill="#064E36" stroke="#A3D977" stroke-width="2" />
  <text x="400" y="452" font-family="'Outfit', sans-serif" font-size="15.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    COMPOSITE SCIENCE LABORATORY
  </text>
</svg>
