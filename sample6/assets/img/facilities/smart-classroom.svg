<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E36" />
      <stop offset="60%" stop-color="#075B3B" />
      <stop offset="100%" stop-color="#087F50" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A2F" />
      <stop offset="100%" stop-color="#0E231B" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" />
  <circle cx="700" cy="80" r="220" fill="#A3D977" opacity="0.08" />
  <circle cx="100" cy="450" r="180" fill="#FFFFFF" opacity="0.05" />

  <!-- Grid Pattern -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Large Interactive Smart Board -->
  <rect x="180" y="70" width="440" height="250" rx="14" fill="#0E231B" stroke="#A3D977" stroke-width="6" />
  <!-- Screen Inner -->
  <rect x="195" y="85" width="410" height="220" rx="8" fill="url(#screenGrad)" />
  
  <!-- Content on Smart Board -->
  <circle cx="260" cy="155" r="32" fill="#087F50" stroke="#A3D977" stroke-width="2" />
  <text x="260" y="162" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">E = mc²</text>

  <!-- Bar Chart on Smart Screen -->
  <rect x="350" y="190" width="22" height="60" rx="4" fill="#A3D977" />
  <rect x="385" y="150" width="22" height="100" rx="4" fill="#087F50" />
  <rect x="420" y="130" width="22" height="120" rx="4" fill="#A3D977" />
  <rect x="455" y="170" width="22" height="80" rx="4" fill="#FFFFFF" opacity="0.8" />
  <line x1="335" y1="250" x2="495" y2="250" stroke="#A3D977" stroke-width="2" />

  <text x="400" y="115" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#A3D977" text-anchor="middle" letter-spacing="1">
    ICT ENABLED INTERACTIVE BOARD
  </text>

  <!-- Smart Board Stand -->
  <rect x="375" y="320" width="50" height="50" fill="#064E36" />
  <path d="M 320 370 L 480 370 L 460 380 L 340 380 Z" fill="#064E36" stroke="#A3D977" stroke-width="2" />

  <!-- Student Desks Silhouette -->
  <rect x="120" y="390" width="160" height="40" rx="6" fill="#075B3B" stroke="#E1EAE3" stroke-width="1.5" />
  <rect x="320" y="390" width="160" height="40" rx="6" fill="#075B3B" stroke="#E1EAE3" stroke-width="1.5" />
  <rect x="520" y="390" width="160" height="40" rx="6" fill="#075B3B" stroke="#E1EAE3" stroke-width="1.5" />

  <!-- Badge / Facility Title Banner -->
  <rect x="230" y="445" width="340" height="38" rx="19" fill="#064E36" stroke="#A3D977" stroke-width="2" />
  <text x="400" y="470" font-family="'Outfit', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    SMART CLASSROOM FACILITY
  </text>
</svg>
