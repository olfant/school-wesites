<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPrinc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#087F50" />
      <stop offset="100%" stop-color="#064E36" />
    </linearGradient>
  </defs>

  <circle cx="200" cy="200" r="190" fill="url(#bgPrinc)" stroke="#A3D977" stroke-width="8" />
  
  <!-- Silhouette / Stylized Portrait of Principal -->
  <g fill="#FFFFFF" opacity="0.95">
    <!-- Academic Cap / Mortarboard / Dignified Head -->
    <circle cx="200" cy="140" r="60" fill="#E8F5EC" stroke="#064E36" stroke-width="3" />
    <!-- Glasses -->
    <rect x="165" y="130" width="30" height="18" rx="4" fill="none" stroke="#064E36" stroke-width="3" />
    <rect x="205" y="130" width="30" height="18" rx="4" fill="none" stroke="#064E36" stroke-width="3" />
    <line x1="195" y1="138" x2="205" y2="138" stroke="#064E36" stroke-width="3" />
    
    <!-- Academic Robe & Shoulders -->
    <path d="M 110 330 C 110 230, 140 215, 200 215 C 260 215, 290 230, 290 330 Z" fill="#E8F5EC" />
    <!-- Formal Tie / Collar -->
    <polygon points="200,225 185,250 200,310 215,250" fill="#064E36" />
    <!-- Collar -->
    <polygon points="180,215 200,245 220,215" fill="#FFFFFF" />
  </g>

  <!-- Gold/Lime Ribbon Badge at Bottom -->
  <rect x="90" y="335" width="220" height="36" rx="18" fill="#064E36" stroke="#A3D977" stroke-width="2.5" />
  <text x="200" y="358" font-family="'Outfit', sans-serif" font-size="13.5" font-weight="800" fill="#A3D977" text-anchor="middle" letter-spacing="1">
    PRINCIPAL'S DESK
  </text>
</svg>
