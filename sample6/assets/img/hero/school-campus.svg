<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E36" />
      <stop offset="50%" stop-color="#075B3B" />
      <stop offset="100%" stop-color="#087F50" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5EC" />
      <stop offset="100%" stop-color="#D3EBD9" />
    </linearGradient>
    <linearGradient id="bldgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F6F2" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A3D977" />
      <stop offset="100%" stop-color="#087F50" />
    </linearGradient>
  </defs>

  <!-- Sky & Atmosphere -->
  <rect width="1200" height="800" fill="url(#skyGrad)" />
  
  <!-- Subtle Constellation / Geometric Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5">
    <circle cx="300" cy="200" r="180" />
    <circle cx="900" cy="250" r="220" />
    <line x1="100" y1="100" x2="1100" y2="700" stroke-dasharray="8 8" />
  </g>

  <!-- Mountain / Hill Backdrop (Jharkhand Hills) -->
  <path d="M 0 520 Q 300 380, 600 480 T 1200 450 L 1200 800 L 0 800 Z" fill="#053E2B" opacity="0.75" />
  <path d="M 0 560 Q 350 460, 750 540 T 1200 520 L 1200 800 L 0 800 Z" fill="#043323" opacity="0.9" />

  <!-- School Campus Ground & Lawns -->
  <rect x="0" y="600" width="1200" height="200" fill="url(#groundGrad)" />
  <path d="M 450 800 L 550 630 L 650 630 L 750 800 Z" fill="#C5DEC9" opacity="0.6" />

  <!-- Main School Building Complex (+2 Block) -->
  <g id="mainBuilding" transform="translate(250, 360)">
    <!-- Central Portico & Pillars -->
    <rect x="180" y="0" width="340" height="270" rx="6" fill="url(#bldgGrad)" stroke="#E1EAE3" stroke-width="3" />
    <!-- Clock Tower / Pediment -->
    <path d="M 280 0 L 350 -60 L 420 0 Z" fill="#087F50" stroke="#A3D977" stroke-width="3" />
    <circle cx="350" cy="-22" r="18" fill="#FFFFFF" stroke="#064E36" stroke-width="3" />
    <line x1="350" y1="-22" x2="350" y2="-32" stroke="#064E36" stroke-width="2.5" stroke-linecap="round" />
    <line x1="350" y1="-22" x2="358" y2="-22" stroke="#064E36" stroke-width="2" stroke-linecap="round" />
    <!-- National Flag Post -->
    <line x1="350" y1="-60" x2="350" y2="-120" stroke="#FFFFFF" stroke-width="3" />
    <!-- Tricolour Flag -->
    <rect x="350" y="-120" width="45" height="10" fill="#FF9933" />
    <rect x="350" y="-110" width="45" height="10" fill="#FFFFFF" />
    <rect x="350" y="-100" width="45" height="10" fill="#138808" />
    <circle cx="372.5" cy="-105" r="3.5" fill="none" stroke="#000080" stroke-width="1" />

    <!-- Left Wing -->
    <rect x="0" y="50" width="200" height="220" rx="4" fill="#FFFFFF" stroke="#E1EAE3" stroke-width="2" />
    <rect x="0" y="40" width="200" height="12" fill="#087F50" />
    <!-- Right Wing -->
    <rect x="500" y="50" width="200" height="220" rx="4" fill="#FFFFFF" stroke="#E1EAE3" stroke-width="2" />
    <rect x="500" y="40" width="200" height="12" fill="#087F50" />

    <!-- Windows Left Wing -->
    <g fill="#075B3B" opacity="0.85">
      <rect x="25" y="75" width="35" height="45" rx="3" />
      <rect x="80" y="75" width="35" height="45" rx="3" />
      <rect x="135" y="75" width="35" height="45" rx="3" />
      
      <rect x="25" y="140" width="35" height="45" rx="3" />
      <rect x="80" y="140" width="35" height="45" rx="3" />
      <rect x="135" y="140" width="35" height="45" rx="3" />

      <rect x="25" y="205" width="35" height="45" rx="3" />
      <rect x="80" y="205" width="35" height="45" rx="3" />
      <rect x="135" y="205" width="35" height="45" rx="3" />
    </g>

    <!-- Windows Right Wing -->
    <g fill="#075B3B" opacity="0.85">
      <rect x="530" y="75" width="35" height="45" rx="3" />
      <rect x="585" y="75" width="35" height="45" rx="3" />
      <rect x="640" y="75" width="35" height="45" rx="3" />

      <rect x="530" y="140" width="35" height="45" rx="3" />
      <rect x="585" y="140" width="35" height="45" rx="3" />
      <rect x="640" y="140" width="35" height="45" rx="3" />

      <rect x="530" y="205" width="35" height="45" rx="3" />
      <rect x="585" y="205" width="35" height="45" rx="3" />
      <rect x="640" y="205" width="35" height="45" rx="3" />
    </g>

    <!-- Central Grand Entrance Arch -->
    <rect x="290" y="160" width="120" height="110" rx="60" fill="#064E36" />
    <path d="M 290 270 L 410 270" stroke="#A3D977" stroke-width="4" />
    <!-- School Board on Facade -->
    <rect x="210" y="15" width="280" height="35" rx="6" fill="#064E36" stroke="#A3D977" stroke-width="2" />
    <text x="350" y="38" font-family="'Outfit', sans-serif" font-size="13.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      CM SOE VNIKETAN HALDIPOKHAR
    </text>
  </g>

  <!-- Trees & Greenery on Campus -->
  <g fill="#087F50" opacity="0.95">
    <ellipse cx="140" cy="620" rx="55" ry="75" />
    <rect x="135" y="660" width="10" height="45" fill="#4A2E12" />
    <ellipse cx="1060" cy="620" rx="60" ry="80" />
    <rect x="1055" y="660" width="10" height="45" fill="#4A2E12" />
    <ellipse cx="230" cy="635" rx="40" ry="50" fill="#075B3B" />
    <ellipse cx="970" cy="635" rx="45" ry="55" fill="#075B3B" />
  </g>

  <!-- Floating School Badge in Corner -->
  <g transform="translate(80, 80)">
    <rect width="360" height="70" rx="35" fill="rgba(6, 78, 54, 0.85)" stroke="#A3D977" stroke-width="2" />
    <circle cx="35" cy="35" r="22" fill="#A3D977" />
    <text x="35" y="42" font-family="'Outfit', sans-serif" font-size="16" font-weight="900" fill="#064E36" text-anchor="middle">SOE</text>
    <text x="75" y="30" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">GOVERNMENT +2 SCHOOL</text>
    <text x="75" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#D3EBD9">Vniketan Haldipokhar, Jharkhand</text>
  </g>
</svg>
