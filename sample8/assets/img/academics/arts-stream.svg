<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="100%" height="100%">
  <rect width="650" height="420" rx="16" fill="#EAF6EE"/>
  <!-- World Globe & Book of Humanities -->
  <g transform="translate(180, 120)">
    <circle cx="80" cy="90" r="70" fill="#38BDF8" stroke="#0284C7" stroke-width="3"/>
    <ellipse cx="80" cy="90" rx="40" ry="70" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="10" y1="90" x2="150" y2="90" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Open Book of History -->
    <path d="M 180,110 C 210,95 250,95 280,105 L 280,165 C 250,155 210,155 180,170 Z" fill="#FFFFFF" stroke="#105A34" stroke-width="2"/>
    <path d="M 280,105 C 310,95 350,95 380,110 L 380,170 C 350,155 310,155 280,165 Z" fill="#FFFFFF" stroke="#105A34" stroke-width="2"/>
  </g>

  <!-- Badge -->
  <g transform="translate(180, 40)">
    <rect width="290" height="42" rx="21" fill="rgba(255,255,255,0.92)" stroke="#105A34" stroke-width="1.5"/>
    <text x="145" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#105A34" text-anchor="middle">+2 Arts • History, Civics &amp; Literature</text>
  </g>
</svg>