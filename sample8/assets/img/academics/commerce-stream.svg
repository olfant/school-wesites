<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="100%" height="100%">
  <rect width="650" height="420" rx="16" fill="#F4F9F5"/>
  <!-- Growth Bar Chart -->
  <g transform="translate(140, 140)">
    <line x1="0" y1="180" x2="380" y2="180" stroke="#042A1D" stroke-width="3"/>
    <line x1="0" y1="180" x2="0" y2="0" stroke="#042A1D" stroke-width="3"/>

    <rect x="40" y="120" width="45" height="60" rx="4" fill="#37AA70"/>
    <rect x="120" y="80" width="45" height="100" rx="4" fill="#16864A"/>
    <rect x="200" y="45" width="45" height="135" rx="4" fill="#105A34"/>
    <rect x="280" y="15" width="45" height="165" rx="4" fill="#063D27"/>

    <!-- Trend Arrow -->
    <path d="M 60,105 Q 160,50 300,10" stroke="#F59E0B" stroke-width="4" fill="none"/>
    <polygon points="305,5 295,15 315,18" fill="#F59E0B"/>
  </g>

  <!-- Badge -->
  <g transform="translate(190, 40)">
    <rect width="270" height="42" rx="21" fill="rgba(255,255,255,0.92)" stroke="#105A34" stroke-width="1.5"/>
    <text x="135" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#105A34" text-anchor="middle">+2 Commerce • Accountancy &amp; Trade</text>
  </g>
</svg>