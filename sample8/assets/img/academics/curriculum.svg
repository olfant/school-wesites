    <text x="45" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#596B60" text-anchor="middle">Accts • BST • Econ</text>
  </g>
  <line x1="425" y1="125" x2="375" y2="175" stroke="#16864A" stroke-width="3"/>

  <!-- Arts & Humanities Node -->
