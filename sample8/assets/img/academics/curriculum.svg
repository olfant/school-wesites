<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="100%" height="100%">
  <rect width="650" height="420" rx="16" fill="#F4F9F5"/>
  <circle cx="325" cy="210" r="140" fill="#EAF6EE" stroke="#37AA70" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Center Hub -->
  <circle cx="325" cy="210" r="60" fill="#105A34"/>
  <text x="325" y="206" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">ACADEMIC</text>
  <text x="325" y="224" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#D7F0DF" text-anchor="middle">CURRICULUM</text>

  <!-- Science Node -->
  <g transform="translate(140, 90)">
    <circle cx="45" cy="45" r="45" fill="#FFFFFF" stroke="#16864A" stroke-width="2.5"/>
    <text x="45" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#105A34" text-anchor="middle">SCIENCE</text>
    <text x="45" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#596B60" text-anchor="middle">Physics • Chem • Bio</text>
  </g>
  <line x1="225" y1="125" x2="275" y2="175" stroke="#16864A" stroke-width="3"/>

  <!-- Commerce Node -->
