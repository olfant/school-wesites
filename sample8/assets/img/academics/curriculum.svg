    <circle cx="45" cy="45" r="45" fill="#FFFFFF" stroke="#16864A" stroke-width="2.5"/>
    <text x="45" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#105A34" text-anchor="middle">ARTS</text>
    <text x="45" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#596B60" text-anchor="middle">Hist • Pol • Geog</text>
