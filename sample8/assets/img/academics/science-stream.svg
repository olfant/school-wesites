<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="100%" height="100%">
  <rect width="650" height="420" rx="16" fill="#EAF6EE"/>
  <!-- Central Rutherford-Bohr Atomic Orbitals -->
  <g transform="translate(325, 210)">
    <circle cx="0" cy="0" r="28" fill="#105A34"/>
    <ellipse cx="0" cy="0" rx="140" ry="50" fill="none" stroke="#16864A" stroke-width="2.5" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="140" ry="50" fill="none" stroke="#37AA70" stroke-width="2.5" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="140" ry="50" fill="none" stroke="#042A1D" stroke-width="2.5" transform="rotate(90)"/>

    <!-- Electrons orbiting -->
    <circle cx="120" cy="70" r="10" fill="#38BDF8"/>
    <circle cx="-120" cy="70" r="10" fill="#F43F5E"/>
    <circle cx="0" cy="-140" r="10" fill="#FDE047"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(200, 35)">
    <rect width="250" height="42" rx="21" fill="rgba(255,255,255,0.92)" stroke="#105A34" stroke-width="1.5"/>
    <text x="125" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#105A34" text-anchor="middle">+2 Science Stream • STEM</text>
  </g>
</svg>