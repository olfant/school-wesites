    <path d="M 170,50 C 220,50 220,130 170,130" stroke="url(#goldTr)" stroke-width="14" fill="none"/>
    <path d="M 20,40 L 180,40 C 180,140 130,180 100,180 C 70,180 20,140 20,40 Z" fill="url(#goldTr)" stroke="#A16207" stroke-width="4"/>
    <polygon points="100,80 105,95 120,95 108,105 112,120 100,110 88,120 92,105 80,95 95,95" fill="#FFFFFF"/>
    <rect x="90" y="180" width="20" height="55" fill="url(#goldTr)"/>
    <polygon points="60,235 140,235 150,265 50,265" fill="url(#goldTr)"/>
    <!-- Pedestal Base -->
    <rect x="35" y="265" width="130" height="55" rx="8" fill="#042A1D"/>
    <rect x="50" y="280" width="100" height="24" rx="4" fill="#D7F0DF"/>
    <text x="100" y="296" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#042A1D" text-anchor="middle">EXCELLENCE</text>
  </g>
