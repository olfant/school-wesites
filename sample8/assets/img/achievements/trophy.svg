<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="100%" height="100%">
  <defs>
    <linearGradient id="goldTr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <rect width="520" height="520" rx="24" fill="#EAF6EE"/>

  <!-- Laurel Wreath -->
  <g stroke="#16864A" stroke-width="6" fill="none" opacity="0.6">
    <path d="M 120,330 C 80,230 120,130 220,95"/>
    <path d="M 400,330 C 440,230 400,130 300,95"/>
  </g>

  <!-- Cup Trophy -->
  <g transform="translate(160, 115)">
