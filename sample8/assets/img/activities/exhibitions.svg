<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="100%" height="100%">
  <rect width="650" height="420" rx="16" fill="#F4F9F5"/>
  <!-- Exhibition Board -->
  <rect x="70" y="90" width="510" height="270" rx="12" fill="#FFFFFF" stroke="#37AA70" stroke-width="3"/>
  <rect x="60" y="70" width="530" height="32" rx="6" fill="#105A34"/>
  <text x="325" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">ANNUAL SCIENCE &amp; INNOVATION EXHIBITION</text>

  <!-- Science Solar Model on Left -->
  <g transform="translate(150, 150)">
    <circle cx="80" cy="80" r="30" fill="#F59E0B"/>
    <ellipse cx="80" cy="80" rx="75" ry="26" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="135" cy="70" r="10" fill="#38BDF8"/>
    <ellipse cx="80" cy="80" rx="100" ry="38" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="28" cy="95" r="12" fill="#EF4444"/>
    <rect x="76" y="110" width="8" height="50" fill="#475569"/>
    <rect x="55" y="160" width="50" height="8" rx="2" fill="#334155"/>
  </g>

  <!-- Robotics Innovation on Right -->
  <g transform="translate(400, 160)">
    <rect x="40" y="20" width="60" height="50" rx="8" fill="#475569"/>
    <circle cx="55" cy="40" r="6" fill="#38BDF8"/>
    <circle cx="85" cy="40" r="6" fill="#38BDF8"/>
    <rect x="30" y="75" width="80" height="70" rx="8" fill="#1E293B"/>
    <line x1="15" y1="90" x2="30" y2="90" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
    <line x1="110" y1="90" x2="125" y2="90" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>