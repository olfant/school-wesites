<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="100%" height="100%">
  <rect width="650" height="420" rx="16" fill="#EAF6EE"/>
  <!-- Track -->
  <path d="M 0,390 C 200,360 450,360 650,390 L 650,420 L 0,420 Z" fill="#DC2626"/>
  <path d="M 0,340 C 200,300 450,300 650,340" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 8" fill="none"/>

  <!-- Athletic Sprinter in Motion -->
  <g transform="translate(280, 90)">
    <circle cx="50" cy="40" r="22" fill="#105A34"/>
    <path d="M 50,62 L 65,125 L 35,170 L 10,165" stroke="#105A34" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 65,125 L 100,155 L 120,195" stroke="#105A34" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 50,75 L 20,105 L 10,95" stroke="#105A34" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 50,75 L 90,90 L 105,115" stroke="#105A34" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Badminton Shuttlecock & Racket -->
  <g transform="translate(460, 190)">
    <ellipse cx="60" cy="50" rx="30" ry="38" fill="none" stroke="#2563EB" stroke-width="4"/>
    <line x1="60" y1="88" x2="60" y2="170" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
    <circle cx="110" cy="60" r="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  </g>

  <!-- Badge -->
  <g transform="translate(190, 40)">
    <rect width="270" height="42" rx="21" fill="rgba(255,255,255,0.92)" stroke="#105A34" stroke-width="1.5"/>
    <text x="135" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#105A34" text-anchor="middle">Physical Fitness &amp; Sports</text>
  </g>
</svg>