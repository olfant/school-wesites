<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" width="100%" height="100%">
  <defs>
    <linearGradient id="aerialSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF6EE"/>
      <stop offset="100%" stop-color="#D7F0DF"/>
    </linearGradient>
  </defs>
  <rect width="750" height="480" rx="16" fill="url(#aerialSky)"/>

  <!-- Aerial Plot Layout -->
  <polygon points="120,80 630,60 680,420 70,440" fill="#BBF7D0" stroke="#16864A" stroke-width="3"/>

  <!-- Sports Field Oval -->
  <ellipse cx="250" cy="260" rx="130" ry="90" fill="#16864A" stroke="#FFFFFF" stroke-width="2"/>
  <ellipse cx="250" cy="260" rx="80" ry="50" fill="#37AA70" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Academic Complex Blocks -->
  <polygon points="420,120 600,110 590,240 410,250" fill="#FFFFFF" stroke="#105A34" stroke-width="2"/>
  <polygon points="440,140 580,130 575,220 435,230" fill="#D7F0DF"/>

  <!-- Laboratory Wing -->
  <polygon points="410,270 560,260 550,360 400,370" fill="#FFFFFF" stroke="#105A34" stroke-width="2"/>

  <!-- Plantation Belt -->
  <g fill="#105A34">
    <circle cx="100" cy="110" r="18"/>
    <circle cx="130" cy="95" r="15"/>
    <circle cx="160" cy="90" r="16"/>
    <circle cx="610" cy="380" r="20"/>
    <circle cx="640" cy="360" r="18"/>
    <circle cx="660" cy="390" r="16"/>
  </g>

  <!-- Glass Callout -->
  <g transform="translate(480, 50)">
    <rect width="210" height="42" rx="21" fill="rgba(255,255,255,0.92)" stroke="#105A34" stroke-width="1.5"/>
    <text x="20" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#105A34">Campus Master Plan Overview</text>
  </g>
</svg>