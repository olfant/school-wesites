<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="100%" height="100%">
  <rect width="650" height="420" rx="16" fill="#F4F9F5"/>
  <!-- Library Wooden Shelves -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="530" height="240" rx="6" fill="#8D6E63" stroke="#5D4037" stroke-width="4"/>
    <line x1="0" y1="80" x2="530" y2="80" stroke="#5D4037" stroke-width="4"/>
    <line x1="0" y1="160" x2="530" y2="160" stroke="#5D4037" stroke-width="4"/>

    <!-- Row 1 Books -->
    <g fill="#105A34">
      <rect x="20" y="15" width="20" height="65" rx="2"/>
      <rect x="42" y="10" width="24" height="70" rx="2" fill="#16864A"/>
      <rect x="68" y="20" width="18" height="60" rx="2" fill="#37AA70"/>
      <rect x="88" y="12" width="22" height="68" rx="2" fill="#063D27"/>
      <rect x="112" y="18" width="26" height="62" rx="2" fill="#D97706"/>
    </g>
    <!-- Row 2 Books -->
    <g fill="#2563EB">
      <rect x="20" y="95" width="25" height="65" rx="2"/>
      <rect x="47" y="90" width="20" height="70" rx="2" fill="#1D4ED8"/>
      <rect x="69" y="100" width="22" height="60" rx="2" fill="#0D9488"/>
      <rect x="93" y="92" width="26" height="68" rx="2" fill="#042A1D"/>
    </g>
    <!-- Digital Terminals & e-Books Display -->
    <g transform="translate(300, 20)">
      <rect x="0" y="0" width="190" height="120" rx="6" fill="#042A1D" stroke="#37AA70" stroke-width="2"/>
      <rect x="10" y="10" width="170" height="100" rx="4" fill="#063D27"/>
      <text x="95" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">DIGITAL E-LIBRARY</text>
      <text x="95" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#D7F0DF" text-anchor="middle">5,000+ Online Books &amp; Journals</text>
    </g>
  </g>

  <!-- Reading Desk -->
  <rect x="120" y="310" width="410" height="24" rx="4" fill="#A1887F"/>
  <rect x="140" y="334" width="14" height="60" fill="#5D4037"/>
  <rect x="500" y="334" width="14" height="60" fill="#5D4037"/>
  <circle cx="325" cy="290" r="14" fill="#FDE047"/>
</svg>