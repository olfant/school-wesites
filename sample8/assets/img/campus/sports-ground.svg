<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="100%" height="100%">
  <rect width="650" height="420" rx="16" fill="#EAF6EE"/>
  <!-- Synthetic Athletics Track (Red Ochre) -->
  <path d="M 0,390 C 200,360 450,360 650,390 L 650,420 L 0,420 Z" fill="#DC2626"/>
  <path d="M 0,340 C 200,300 450,300 650,340" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
  <path d="M 0,290 C 200,250 450,250 650,290" stroke="#FFFFFF" stroke-width="3" fill="none"/>

  <!-- Football / Soccer Field Goal -->
  <g transform="translate(180, 100)">
    <rect x="0" y="40" width="280" height="150" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="0" y1="40" x2="280" y2="40" stroke="#FFFFFF" stroke-width="4"/>
    <g stroke="rgba(255,255,255,0.4)" stroke-width="1.5">
      <line x1="40" y1="40" x2="40" y2="190"/>
      <line x1="80" y1="40" x2="80" y2="190"/>
      <line x1="120" y1="40" x2="120" y2="190"/>
      <line x1="160" y1="40" x2="160" y2="190"/>
      <line x1="200" y1="40" x2="200" y2="190"/>
      <line x1="240" y1="40" x2="240" y2="190"/>
    </g>
  </g>

  <!-- Football in play -->
  <circle cx="120" cy="275" r="32" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <polygon points="120,260 128,268 124,280 114,280 110,268" fill="#0F172A"/>

  <!-- Badge -->
  <g transform="translate(430, 40)">
    <rect width="180" height="38" rx="19" fill="#FFFFFF" stroke="#16864A" stroke-width="1.5"/>
    <text x="24" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#105A34">Athletics &amp; Sports Ground</text>
  </g>
</svg>