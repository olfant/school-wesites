<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <linearGradient id="heroSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042A1D"/>
      <stop offset="45%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#16864A"/>
    </linearGradient>
    <linearGradient id="glassCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#37AA70"/>
      <stop offset="100%" stop-color="#D7F0DF"/>
    </linearGradient>
    <filter id="heroBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
    </filter>
  </defs>

  <!-- Deep Gradient Background -->
  <rect width="900" height="650" rx="24" fill="url(#heroSky)"/>

  <!-- Glowing Blurred Atmospheric Orbs (Glassmorphism Environment) -->
  <circle cx="200" cy="180" r="160" fill="#37AA70" opacity="0.3" filter="url(#heroBlur)"/>
  <circle cx="750" cy="220" r="180" fill="#16864A" opacity="0.35" filter="url(#heroBlur)"/>
  <circle cx="500" cy="480" r="200" fill="#D7F0DF" opacity="0.18" filter="url(#heroBlur)"/>

  <!-- Perspective Campus Architecture Grid (Digital Campus Portal) -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="1.2">
    <line x1="100" y1="450" x2="800" y2="450"/>
    <line x1="50" y1="520" x2="850" y2="520"/>
    <line x1="0" y1="600" x2="900" y2="600"/>
    <line x1="450" y1="360" x2="200" y2="650"/>
    <line x1="450" y1="360" x2="350" y2="650"/>
    <line x1="450" y1="360" x2="550" y2="650"/>
    <line x1="450" y1="360" x2="700" y2="650"/>
  </g>

  <!-- Modern Digital School Campus Building Silhouette -->
  <g transform="translate(180, 220)">
    <!-- Main Center Wing -->
    <rect x="140" y="60" width="260" height="150" rx="8" fill="rgba(6, 61, 39, 0.85)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <!-- Glass Roof Deck -->
    <polygon points="270,10 120,60 420,60" fill="rgba(16, 90, 52, 0.95)" stroke="url(#accentGlow)" stroke-width="2"/>
    <!-- Central Tower & Flag -->
    <rect x="240" y="-30" width="60" height="50" rx="4" fill="#042A1D" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <line x1="270" y1="-30" x2="270" y2="-85" stroke="#D7F0DF" stroke-width="3"/>
    <!-- Indian Tricolor Flag -->
    <rect x="270" y="-85" width="34" height="7" fill="#FF9933"/>
    <rect x="270" y="-78" width="34" height="7" fill="#FFFFFF"/>
    <circle cx="287" cy="-74.5" r="3" fill="#000080"/>
    <rect x="270" y="-71" width="34" height="7" fill="#138808"/>

    <!-- Left & Right Glass Academic Wings -->
    <rect x="10" y="90" width="130" height="120" rx="6" fill="rgba(4, 42, 29, 0.75)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <rect x="400" y="90" width="130" height="120" rx="6" fill="rgba(4, 42, 29, 0.75)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

    <!-- Illuminated Windows & Labs -->
    <g fill="#D7F0DF" opacity="0.85">
      <rect x="40" y="115" width="25" height="35" rx="4"/>
      <rect x="85" y="115" width="25" height="35" rx="4"/>
      <rect x="175" y="85" width="30" height="40" rx="4"/>
      <rect x="225" y="85" width="30" height="40" rx="4"/>
      <rect x="285" y="85" width="30" height="40" rx="4"/>
      <rect x="335" y="85" width="30" height="40" rx="4"/>
      <rect x="430" y="115" width="25" height="35" rx="4"/>
      <rect x="475" y="115" width="25" height="35" rx="4"/>
      <!-- Grand Glass Portal Entrance -->
      <path d="M 245,210 L 245,150 Q 270,135 295,150 L 295,210 Z" fill="#37AA70" opacity="0.9"/>
    </g>
  </g>

  <!-- Floating Translucent Glass Panel (The Prompt Feature) -->
  <g transform="translate(520, 80)">
    <rect width="320" height="240" rx="20" fill="url(#glassCardGrad)" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
    <circle cx="45" cy="48" r="22" fill="#37AA70"/>
    <path d="M 38,48 L 44,54 L 54,42" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <text x="80" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">DIGITAL CAMPUS PORTAL</text>
    <text x="80" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#D7F0DF">CM SOE HALDIPOKHAR</text>
    <line x1="25" y1="88" x2="295" y2="88" stroke="rgba(255,255,255,0.2)"/>
    <g fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif">
      <text x="25" y="122" font-size="11" opacity="0.8">Level:</text>
      <text x="90" y="122" font-size="12" font-weight="700">+2 Higher Secondary</text>
      <text x="25" y="152" font-size="11" opacity="0.8">U-DISE:</text>
      <text x="90" y="152" font-size="12" font-weight="700">20180231602</text>
      <text x="25" y="182" font-size="11" opacity="0.8">Location:</text>
      <text x="90" y="182" font-size="12" font-weight="700">Haldipokhar, Potka</text>
      <text x="25" y="212" font-size="11" opacity="0.8">Status:</text>
      <text x="90" y="212" font-size="12" font-weight="700" fill="#34D399">School of Excellence</text>
    </g>
  </g>

  <!-- Floating Green Tech Badges & Sparks -->
  <g transform="translate(100, 100)">
    <rect width="180" height="42" rx="21" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)"/>
    <circle cx="24" cy="21" r="10" fill="#34D399"/>
    <text x="44" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Inspire • Learn • Achieve</text>
  </g>
</svg>