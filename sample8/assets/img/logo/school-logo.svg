<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#105A34"/>
      <stop offset="60%" stop-color="#063D27"/>
      <stop offset="100%" stop-color="#042A1D"/>
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37AA70"/>
      <stop offset="50%" stop-color="#D7F0DF"/>
      <stop offset="100%" stop-color="#16864A"/>
    </linearGradient>
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glassDrop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#042A1D" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Glass Ring -->
  <circle cx="120" cy="120" r="114" fill="none" stroke="url(#glowBorder)" stroke-width="3" filter="url(#glassDrop)"/>
  <circle cx="120" cy="120" r="106" fill="url(#shieldGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <circle cx="120" cy="120" r="98" fill="none" stroke="#37AA70" stroke-width="1.5" stroke-dasharray="5 3"/>

  <!-- Sunburst Rays of Wisdom -->
  <g opacity="0.35" stroke="#FDE047" stroke-width="2">
    <line x1="120" y1="36" x2="120" y2="48"/>
    <line x1="150" y1="44" x2="142" y2="55"/>
    <line x1="176" y1="66" x2="165" y2="74"/>
    <line x1="90" y1="44" x2="98" y2="55"/>
    <line x1="64" y1="66" x2="75" y2="74"/>
  </g>

  <!-- Flame of Knowledge -->
  <path d="M120 48 C128 62 138 74 132 88 C128 96 118 100 115 94 C111 89 116 83 115 78 C111 85 105 91 106 98 C107 109 121 114 120 120 C115 116 113 108 108 106 C101 101 103 87 109 78 C116 69 115 56 120 48 Z" fill="url(#torchGrad)"/>

  <!-- Open Digital Book / Educational Platform -->
  <path d="M120 138 C102 124 66 126 50 132 C48 133 46 135 46 139 L46 172 C66 165 101 163 120 177 C139 163 174 165 194 172 L194 139 C194 135 192 133 190 132 C174 126 138 124 120 138 Z" fill="#FFFFFF" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.2))"/>
  <path d="M120 138 L120 177" stroke="#105A34" stroke-width="2.5"/>
  <path d="M60 145 C78 140 100 142 113 149" stroke="#D7F0DF" stroke-width="2" fill="none"/>
  <path d="M60 155 C78 150 100 152 113 159" stroke="#D7F0DF" stroke-width="2" fill="none"/>
  <path d="M180 145 C162 140 140 142 127 149" stroke="#D7F0DF" stroke-width="2" fill="none"/>
  <path d="M180 155 C162 150 140 152 127 159" stroke="#D7F0DF" stroke-width="2" fill="none"/>

  <!-- Sprouting Growth Leaves -->
  <path d="M120 125 C130 113 148 115 153 125 C146 132 130 132 120 125 Z" fill="#37AA70"/>
  <path d="M120 125 C110 113 92 115 87 125 C94 132 110 132 120 125 Z" fill="#37AA70"/>

  <!-- Text Arcs -->
  <path id="logoTextArcTop" d="M 32,120 A 88,88 0 1,1 208,120" fill="none"/>
  <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10.5" fill="#D7F0DF" letter-spacing="1.5">
    <textPath href="#logoTextArcTop" startOffset="50%" text-anchor="middle">
      CM SOE VNIKETAN HALDIPOKHAR
    </textPath>
  </text>

  <path id="logoTextArcBottom" d="M 208,120 A 88,88 0 0,1 32,120" fill="none"/>
  <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#FDE047" letter-spacing="1.8">
    <textPath href="#logoTextArcBottom" startOffset="50%" text-anchor="middle">
      GOVT +2 HIGH SCHOOL • POTKA
    </textPath>
  </text>
</svg>