<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" width="100%" height="100%">
  <defs>
    <linearGradient id="prBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF6EE"/>
      <stop offset="50%" stop-color="#D7F0DF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#042A1D"/>
    </linearGradient>
    <filter id="prDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042A1D" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Modern Glass Frame Silhouette -->
  <rect width="520" height="620" rx="28" fill="url(#prBg)" stroke="#37AA70" stroke-width="3" filter="url(#prDrop)"/>

  <!-- Background Decorative Glass Elements -->
  <g opacity="0.25" fill="#105A34">
    <rect x="80" y="100" width="16" height="70" rx="3"/>
    <rect x="102" y="115" width="14" height="55" rx="3"/>
    <rect x="120" y="95" width="18" height="75" rx="3"/>
    <rect x="380" y="105" width="16" height="65" rx="3"/>
    <rect x="402" y="90" width="20" height="80" rx="3"/>
  </g>

  <!-- Professional Silhouette -->
  <g transform="translate(160, 130)">
    <ellipse cx="100" cy="110" rx="48" ry="58" fill="#E2B184"/>
    <path d="M 50,100 C 48,55 152,55 150,100 C 146,75 130,68 100,68 C 70,68 54,75 50,100 Z" fill="#374151"/>
    <!-- Glasses -->
    <rect x="68" y="95" width="26" height="20" rx="4" fill="none" stroke="#1F2937" stroke-width="3"/>
    <rect x="106" y="95" width="26" height="20" rx="4" fill="none" stroke="#1F2937" stroke-width="3"/>
    <line x1="94" y1="105" x2="106" y2="105" stroke="#1F2937" stroke-width="3"/>
    <!-- Shirt Collar & Tie -->
    <polygon points="75,180 100,215 125,180" fill="#FFFFFF"/>
    <polygon points="95,195 105,195 108,275 100,290 92,275" fill="#16864A"/>
    <!-- Suit Blazer -->
    <path d="M 15,205 L 75,180 L 95,285 L 5,350 Z" fill="url(#suitGrad)"/>
    <path d="M 185,205 L 125,180 L 105,285 L 195,350 Z" fill="url(#suitGrad)"/>
    <path d="M 5,350 L 75,380 L 125,380 L 195,350 L 210,450 L -10,450 Z" fill="#042A1D"/>
  </g>

  <!-- Elegant Glass Placeholder Badge at Bottom -->
  <g transform="translate(90, 500)">
    <rect width="340" height="74" rx="37" fill="#FFFFFF" stroke="#105A34" stroke-width="2" filter="url(#prDrop)"/>
    <circle cx="42" cy="37" r="24" fill="#D7F0DF"/>
    <path d="M 42,24 L 46,32 L 55,33 L 48,40 L 50,49 L 42,44 L 34,49 L 36,40 L 29,33 L 38,32 Z" fill="#16864A"/>
    <text x="82" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#042A1D">[Principal's Name Placeholder]</text>
    <text x="82" y="53" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#16864A">Official Institutional Desk • CM SOE</text>
  </g>
</svg>