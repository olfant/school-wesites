<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="100%" height="100%">
  <defs>
    <linearGradient id="stuBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF6EE"/>
      <stop offset="100%" stop-color="#D7F0DF"/>
    </linearGradient>
  </defs>
  <rect width="650" height="420" rx="16" fill="url(#stuBgGrad)"/>

  <!-- Three Modern Students engaged in Digital Learning -->
  <!-- Student Left (Girl with Tablet) -->
  <g transform="translate(140, 160)">
    <circle cx="45" cy="35" r="22" fill="#F5D0A9"/>
    <path d="M 28,30 C 28,12 62,12 62,30 C 62,36 56,44 45,44 C 34,44 28,36 28,30 Z" fill="#2D3748"/>
    <path d="M 22,58 L 68,58 L 74,130 L 16,130 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <polygon points="43,62 47,62 50,90 45,98 40,90" fill="#16864A"/>
    <rect x="20" y="130" width="50" height="50" fill="#042A1D"/>
    <!-- Tablet in hands -->
    <rect x="45" y="80" width="34" height="44" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  </g>

  <!-- Student Center (Boy with Laptop) -->
  <g transform="translate(280, 135)">
    <circle cx="45" cy="35" r="22" fill="#E2B184"/>
    <path d="M 25,30 C 25,10 65,10 65,30 C 62,38 45,42 25,30 Z" fill="#1A202C"/>
    <path d="M 20,58 L 70,58 L 76,135 L 14,135 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <polygon points="43,62 47,62 50,90 45,98 40,90" fill="#16864A"/>
    <rect x="18" y="135" width="54" height="55" fill="#105A34"/>
    <!-- Open Modern Laptop -->
    <rect x="26" y="82" width="38" height="48" rx="4" fill="#0F172A"/>
    <rect x="28" y="85" width="34" height="40" rx="2" fill="#38BDF8"/>
  </g>

  <!-- Student Right (Student taking notes) -->
  <g transform="translate(420, 160)">
    <circle cx="45" cy="35" r="22" fill="#FDE047"/>
    <path d="M 26,26 C 26,12 64,12 64,26 C 64,36 56,42 45,42 C 34,42 26,36 26,26 Z" fill="#4B5563"/>
    <path d="M 22,58 L 68,58 L 74,130 L 16,130 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <polygon points="43,62 47,62 50,90 45,98 40,90" fill="#16864A"/>
    <rect x="20" y="130" width="50" height="50" fill="#042A1D"/>
  </g>

  <!-- Floating Glass Tag -->
  <g transform="translate(50, 40)">
    <rect width="210" height="42" rx="21" fill="rgba(255,255,255,0.92)" stroke="#37AA70" stroke-width="1.5"/>
    <text x="24" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#105A34">Interactive Digital Education</text>
  </g>
</svg>