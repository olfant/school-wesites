<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <!-- Architectural grid pattern -->
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D6EBDD" stroke-width="0.8" opacity="0.6"/>
      <circle cx="0" cy="0" r="1.5" fill="#105A34" opacity="0.4"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#EDF5EF"/>
      <stop offset="100%" stop-color="#D6EBDD" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="diagonalGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#063D27"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="600" fill="url(#bgGrad)"/>
  <rect width="900" height="600" fill="url(#archGrid)"/>

  <!-- Architectural Corner Triangles / Diagonal Shapes -->
  <polygon points="0,0 225.0,0 0,210.0" fill="#105A34" opacity="0.08"/>
  <polygon points="900,600 675.0,600 900,390.0" fill="#3DAD72" opacity="0.12"/>
  
  <!-- Architectural Dimension Lines -->
  <line x1="30" y1="30" x2="870" y2="30" stroke="#105A34" stroke-width="1" stroke-dasharray="8,6" opacity="0.3"/>
  <line x1="30" y1="30" x2="30" y2="570" stroke="#105A34" stroke-width="1" stroke-dasharray="8,6" opacity="0.3"/>
  <line x1="870" y1="30" x2="870" y2="570" stroke="#105A34" stroke-width="1" stroke-dasharray="8,6" opacity="0.3"/>
  <line x1="30" y1="570" x2="870" y2="570" stroke="#105A34" stroke-width="1" stroke-dasharray="8,6" opacity="0.3"/>

  <!-- Crosshairs -->
  <g stroke="#105A34" stroke-width="1.5" opacity="0.5">
    <path d="M 20 30 L 40 30 M 30 20 L 30 40"/>
    <path d="M 860 30 L 880 30 M 870 20 L 870 40"/>
    <path d="M 20 570 L 40 570 M 30 560 L 30 580"/>
    <path d="M 860 570 L 880 570 M 870 560 L 870 580"/>
  </g>

  <!-- Decorative Architectural Centerpiece -->
  
        <!-- Isometric Campus Complex -->
        <g transform="translate(450.0, 288.0)">
            <!-- Grid lines ground -->
            <path d="M -260 0 L 0 -150 L 260 0 L 0 150 Z" fill="#EDF5EF" stroke="#D6EBDD" stroke-width="2"/>
            <path d="M -260 0 L 0 150 L 0 200 L -260 50 Z" fill="#D6EBDD" opacity="0.4"/>
            <path d="M 260 0 L 0 150 L 0 200 L 260 50 Z" fill="#063D27" opacity="0.1"/>
            
            <!-- Architectural grid lines -->
            <path d="M -180 -45 L 80 105 M -100 -90 L 160 60 M -20 -135 L 240 15" stroke="#D6EBDD" stroke-width="1.5" stroke-dasharray="4,4"/>
            <path d="M 180 -45 L -80 105 M 100 -90 L -160 60 M 20 -135 L -240 15" stroke="#D6EBDD" stroke-width="1.5" stroke-dasharray="4,4"/>

            <!-- Main Academic Block 1 (Left Wing) -->
            <g transform="translate(-80, -30)">
                <!-- Top Face -->
                <polygon points="0,-80 80,-35 0,10 -80,-35" fill="#3DAD72"/>
                <!-- Left Face -->
                <polygon points="-80,-35 0,10 0,90 -80,45" fill="#105A34"/>
                <!-- Right Face -->
                <polygon points="0,10 80,-35 80,45 0,90" fill="#063D27"/>
                <!-- Architectural windows left -->
                <polygon points="-65,-15 -20,10 -20,25 -65,0" fill="#EDF5EF" opacity="0.8"/>
                <polygon points="-65,15 -20,40 -20,55 -65,30" fill="#EDF5EF" opacity="0.8"/>
                <!-- Architectural windows right -->
                <polygon points="20,10 65,-15 65,0 20,25" fill="#D6EBDD" opacity="0.7"/>
                <polygon points="20,40 65,15 65,30 20,55" fill="#D6EBDD" opacity="0.7"/>
            </g>

            <!-- Main Central Tower / Assembly (Tall Block) -->
            <g transform="translate(40, -80)">
                <!-- Top Face -->
                <polygon points="0,-90 90,-40 0,10 -90,-40" fill="#D6EBDD"/>
                <!-- Left Face -->
                <polygon points="-90,-40 0,10 0,120 -90,70" fill="#3DAD72"/>
                <!-- Right Face -->
                <polygon points="0,10 90,-40 90,70 0,120" fill="#105A34"/>
                <!-- Isometric Glass Curtain -->
                <polygon points="-75,-20 -15,13 -15,95 -75,62" fill="#FFFFFF" opacity="0.6"/>
                <line x1="-45" y1="-3" x2="-45" y2="78" stroke="#063D27" stroke-width="2"/>
                <line x1="-75" y1="20" x2="-15" y2="53" stroke="#063D27" stroke-width="2"/>
            </g>

            <!-- Library / Innovation Center (Front Low Block) -->
            <g transform="translate(-10, 40)">
                <polygon points="0,-50 70,-15 0,20 -70,-15" fill="#FFFFFF"/>
                <polygon points="-70,-15 0,20 0,60 -70,25" fill="#105A34" opacity="0.9"/>
                <polygon points="0,20 70,-15 70,25 0,60" fill="#063D27"/>
                <!-- Portal Entry -->
                <polygon points="-25,22 0,33 0,55 -25,44" fill="#3DAD72"/>
            </g>

            <!-- Isometric Trees and Geometry Markers -->
            <g transform="translate(-160, 20)">
                <polygon points="0,-40 18,-30 0,-20 -18,-30" fill="#3DAD72"/>
                <polygon points="-18,-30 0,-20 0,10 -18,0" fill="#105A34"/>
                <polygon points="0,-20 18,-30 18,0 0,10" fill="#063D27"/>
                <line x1="0" y1="10" x2="0" y2="25" stroke="#063D27" stroke-width="4"/>
            </g>
            <g transform="translate(160, -20)">
                <polygon points="0,-45 20,-34 0,-22 -20,-34" fill="#3DAD72"/>
                <polygon points="-20,-34 0,-22 0,12 -20,0" fill="#105A34"/>
                <polygon points="0,-22 20,-34 20,0 0,12" fill="#063D27"/>
                <line x1="0" y1="12" x2="0" y2="28" stroke="#063D27" stroke-width="4"/>
            </g>
            <!-- Isometric Marker Floating Accent -->
            <g transform="translate(140, -130)">
                <polygon points="0,-20 18,-10 0,0 -18,-10" fill="#3DAD72"/>
                <polygon points="-18,-10 0,0 0,18 -18,8" fill="#105A34"/>
                <polygon points="0,0 18,-10 18,8 0,18" fill="#063D27"/>
                <line x1="0" y1="20" x2="0" y2="50" stroke="#3DAD72" stroke-width="1.5" stroke-dasharray="3,3"/>
            </g>
        </g>
        

  <!-- Header Banner Text Overlay -->
  <g transform="translate(45, 65)">
    <rect x="-10" y="-18" width="417" height="32" fill="#063D27"/>
    <polygon points="407,-18 422,14 407,14" fill="#3DAD72"/>
    <text x="5" y="4" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="2">MODERN TEACHING METHODOLOGIES</text>
  </g>

  <!-- Bottom Details Label -->
  <g transform="translate(45, 555)">
    <rect x="-8" y="-14" width="320" height="26" fill="#FFFFFF" stroke="#D6EBDD" stroke-width="1"/>
    <rect x="-8" y="-14" width="4" height="26" fill="#3DAD72"/>
    <text x="10" y="4" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#105A34" letter-spacing="1">CM SOE VNIKETAN HALDIPOKHAR</text>
    <text x="235" y="4" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#68756C">• Interactive Classrooms</text>
  </g>
</svg>