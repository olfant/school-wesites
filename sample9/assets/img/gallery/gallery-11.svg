<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Architectural grid pattern -->
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D6EBDD" stroke-width="0.8" opacity="0.6"/>
      <circle cx="0" cy="0" r="1.5" fill="#105A34" opacity="0.4"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#EDF5EF"/>
      <stop offset="100%" stop-color="#D6EBDD" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="diagonalGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#105A34"/>
      <stop offset="100%" stop-color="#063D27"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#archGrid)"/>

  <!-- Architectural Corner Triangles / Diagonal Shapes -->
  <polygon points="0,0 200.0,0 0,210.0" fill="#105A34" opacity="0.08"/>
  <polygon points="800,600 600.0,600 800,390.0" fill="#3DAD72" opacity="0.12"/>
  
  <!-- Architectural Dimension Lines -->
  <line x1="30" y1="30" x2="770" y2="30" stroke="#105A34" stroke-width="1" stroke-dasharray="8,6" opacity="0.3"/>
  <line x1="30" y1="30" x2="30" y2="570" stroke="#105A34" stroke-width="1" stroke-dasharray="8,6" opacity="0.3"/>
  <line x1="770" y1="30" x2="770" y2="570" stroke="#105A34" stroke-width="1" stroke-dasharray="8,6" opacity="0.3"/>
  <line x1="30" y1="570" x2="770" y2="570" stroke="#105A34" stroke-width="1" stroke-dasharray="8,6" opacity="0.3"/>

  <!-- Crosshairs -->
  <g stroke="#105A34" stroke-width="1.5" opacity="0.5">
    <path d="M 20 30 L 40 30 M 30 20 L 30 40"/>
    <path d="M 760 30 L 780 30 M 770 20 L 770 40"/>
    <path d="M 20 570 L 40 570 M 30 560 L 30 580"/>
    <path d="M 760 570 L 780 570 M 770 560 L 770 580"/>
  </g>

  <!-- Decorative Architectural Centerpiece -->
  
        <!-- Science Exhibition & Vocational Skills Project -->
        <g transform="translate(400.0, 288.0)">
            <!-- Isometric Pavilion Deck -->
            <polygon points="0,-110 160,-25 0,60 -160,-25" fill="#EDF5EF" stroke="#D6EBDD" stroke-width="2"/>
            <polygon points="-160,-25 0,60 0,100 -160,15" fill="#105A34"/>
            <polygon points="0,60 160,-25 160,15 0,100" fill="#063D27"/>
            <!-- Science Beaker + Innovation Gear -->
            <g transform="translate(-40, -20)">
                <path d="M -15 -50 L 15 -50 L 15 -30 L 40 20 C 45 30 35 45 20 45 L -20 45 C -35 45 -45 30 -40 20 L -15 -30 Z" fill="#FFFFFF" stroke="#105A34" stroke-width="3"/>
                <path d="M -30 10 L 30 10 L 20 42 L -20 42 Z" fill="#3DAD72" opacity="0.7"/>
                <circle cx="-5" cy="20" r="4" fill="#FFFFFF"/>
                <circle cx="10" cy="28" r="6" fill="#FFFFFF"/>
            </g>
            <!-- Isometric Engineering Gear -->
            <g transform="translate(50, -40)">
                <circle cx="0" cy="0" r="42" fill="#3DAD72"/>
                <circle cx="0" cy="0" r="20" fill="#063D27"/>
                <rect x="-6" y="-50" width="12" height="100" fill="#3DAD72"/>
                <rect x="-50" y="-6" width="100" height="12" fill="#3DAD72"/>
                <rect x="-6" y="-50" width="12" height="100" fill="#3DAD72" transform="rotate(45)"/>
                <rect x="-50" y="-6" width="100" height="12" fill="#3DAD72" transform="rotate(45)"/>
                <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
            </g>
        </g>
        

  <!-- Header Banner Text Overlay -->
  <g transform="translate(45, 65)">
    <rect x="-10" y="-18" width="352" height="32" fill="#063D27"/>
    <polygon points="342,-18 357,14 342,14" fill="#3DAD72"/>
    <text x="5" y="4" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="2">CAMPUS GALLERY RECORD 11</text>
  </g>

  <!-- Bottom Details Label -->
  <g transform="translate(45, 555)">
    <rect x="-8" y="-14" width="320" height="26" fill="#FFFFFF" stroke="#D6EBDD" stroke-width="1"/>
    <rect x="-8" y="-14" width="4" height="26" fill="#3DAD72"/>
    <text x="10" y="4" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#105A34" letter-spacing="1">CM SOE VNIKETAN HALDIPOKHAR</text>
    <text x="235" y="4" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#68756C">• Category: Exhibitions</text>
  </g>
</svg>